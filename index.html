uted: #9aa6ba; --line: #2e3a49;\n  --accent: #4fd1c5; --accent-ink: #06302d; --danger: #ff8a80; --ok: #7ee2a8; --ok-bg: #16382a; --bad: #ff9b92; --bad-bg: #432120;\n  --t0: #1b3b39; --t1: #232d54; --t2: #4a2a3d; --t3: #34421d;\n  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 38px rgba(0,0,0,.45);\n  color-scheme: dark;\n}\n\n* { box-sizing: border-box; }\n[hidden] { display: none !important; }\nbody { margin: 0; }\nimg { max-width: 100%; }\nbody {\n  background: var(--bg); color: var(--ink); font-family: var(--f-body);\n  padding-block: 20px 40px;\n  padding-left: max(16px, env(safe-area-inset-left, 0px));\n  padding-right: max(16px, env(safe-area-inset-right, 0px));\n}\nbutton, input, textarea { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\n:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }\n\n.wrap { display: flex; flex-direction: row; align-items: flex-start; justify-content: center; gap: 18px; }\n.stage { flex: 0 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; }\n\n/* Toolbar (screen only) */\n.toolbar {\n  width: min(210mm, 100%); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;\n}\n.tb-left { min-width: 0; display: flex; flex-direction: column; gap: 2px; }\n.tb-left .hint { margin: 0; font-size: 13px; color: var(--muted); }\n.tb-left .count { margin: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }\n.tb-right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }\n.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 10px; border-radius: 8px; background: var(--sheet); border: 1px solid var(--line); cursor: pointer; }\n.switch input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }\n.switch select { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 6px; padding: 3px 6px; font-size: 13px; ma ace-items: center; flex: none;\n}\n.speak:hover { filter: brightness(1.1); }\n.speak.playing { animation: pulse 1s ease-out infinite; }\n@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }\n@media (prefers-reduced-motion: reduce) { .speak.playing { animation: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 45%, transparent); } }\n.edit { width: 26px; height: 26px; border-radius: 6px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; flex: none; }\n.edit:hover { background: var(--line); color: var(--ink); }\n\n.slot {\n  flex: 1; min-width: 0; display: flex; align-items: center; gap: 3mm; padding: 2.2mm; border-radius: 10px;\n  border: 1.5px dashed var(--line); background: transparent; color: var(--muted); font-size: 13px; text-align: left;\n}\n.slot:hover { border-color: var(--accent); color: var(--ink); }\n.slot .slot-num { width: 22mm; align-self: stretch; border-radius: 7px; background: var(--card); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 26px; opacity: .85; font-variant-numeric: tabular-nums; }\n.slot .plus { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font-size: 17px; line-height: 1; flex: none; }\n\n.foot { display: flex; justify-content: space-between; gap: 12px; font-size: 10px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }\n\n/* Editor */\n.overlay {\n  position: fixed; inset: 0; z-index: 50; background: rgba(8,14,24,.58); display: flex; align-items: center; justify-content: center;\n  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));\n}\n.panel {\n  width: min(480px, 100%); max-height: 100%; overflow: auto; background: var(--shee lid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }\n.bk-paste summary { cursor: pointer; font-size: 13px; font-weight: 500; }\n.bk-paste[open] summary { margin-bottom: 8px; }\n.bk-paste textarea { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.4; color: var(--ink); resize: vertical; margin-bottom: 8px; }\n.bk-status { margin: 0; font-size: 13px; color: var(--muted); min-height: 1.2em; }\n.btn[disabled] { opacity: .5; cursor: not-allowed; }\n@media (max-width: 620px) {\n  .bk-head { display: none; }\n  .bk-row { grid-template-columns: 26px minmax(0, 1fr) 32px; padding: 10px 0; border-top: 1px solid var(--line); }\n  .bk-row .bk-n { grid-column: 1; grid-row: 1; }\n  .bk-row .bk-w { grid-column: 2; grid-row: 1; }\n  .bk-row .bk-rm { grid-column: 3; grid-row: 1; }\n  .bk-row .bk-s { grid-column: 2; grid-row: 2; }\n  .bk-row .bk-m { grid-column: 2; grid-row: 3; }\n}\n\n/* On screen: 3 columns on a wide screen, 2 on mid sizes, 1 on phones. Each sheet holds 18 cards (6 rows of 3).\n   The fixed A4 box above is used only when printing. */\n@media screen {\n  body { padding-block: 16px; }\n  .wrap { width: 100%; justify-content: flex-start; gap: 14px; }\n  .stage { flex: 1 1 0; min-width: 0; align-items: stretch; gap: 0; }\n  #sheets { width: 100%; align-items: stretch; gap: 16px; }\n  .sheet { width: 100%; max-width: none; height: auto; min-height: calc(100vh - 32px); padding: 18px 22px 14px; gap: 14px; }\n  .title { font-size: clamp(26px, 2.4vw, 40px); }\n  .sub { font-size: clamp(12.5px, 1vw, 16px); }\n  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: minmax(150px, 1fr); gap: 14px; }\n  .card { grid-template-columns: clamp(92px, 9vw, 160px) minmax(0, 1fr) auto; gap: 12px; padding: 10px; }\n  .thumb { width: auto; height: auto; min-height: 92px; align-self: stretch; }\n  .initial { font-size: clamp(34px, 3.4vw, 60px); }\n  .word { font-size: clamp(18px, 1.5vw, 28px); }\n  .say { font-size: clamp(12px, .9vw, 15px); }\n  .mean { font-size: clamp(13px, .98vw, 17px); line-height: 1.4; }\n  .speak { width: clamp(38px, 3vw, 50px); height: clamp(38px, 3vw, 50px); }\n  .slot { padding: 10px; gap: 12px; font-size: clamp(13px, 1vw, 16px); }\n  .slot .slot-num { width: clamp(70px, 7vw, 120px); align-self: stretch; }\n}\n@media screen and (max-width: 999px) {\n  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n}\n@media screen and (max-width: 699px) {\n  .sheet { padding: 14px 14px 12px; }\n  .grid { grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto; }\n  .card { grid-template-columns: 84px minmax(0, 1fr) auto; }\n  .thumb { height: 84px; align-self: start; min-height: 0; }\n  .slot { min-height: 70px; }\n  .slot .slot-num { width: 50px; height: 50px; align-self: auto; }\n}\n\n.card.now { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }\n.word span { display: inline-block; border-radius: 4px; transition: background .12s; }\n.word span.on { background: var(--mark); color: var(--mark-ink); }\n/* Screen card layout: speaker in the corner so the word gets the full width */\n@media screen {\n  .card { position: relative; grid-template-columns: clamp(64px, 6.5vw, 124px) minmax(0, 1fr); gap: 12px; align-items: stretch; }\n  .actions { position: absolute; top: 8px; right: 8px; bottom: 8px; justify-content: space-between; align-items: flex-end; pointer-events: none; }\n  .actions > * { pointer-events: auto; }\n  .word { padding-right: clamp(46px, 3.8vw, 60px); font-size: clamp(17px, 1.35vw, 26px); }\n  .mean { padding-right: 28px; }\n}\n@media screen and (max-width: 699px) {\n  .card { grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 8px; }\n  .thumb { width: 64px; height: 64px; align-self: start; min-height: 0; }\n  .word { font-size: 17px; padding-right: 46px; }\n}\n\n/* Printing the downloaded file: one A4 sheet per page */\n@media print {\n  @page { size: A4; margin: 0; }\n  :root { padding: 0 !important; }\n  body { background: #fff !important; padding: 0 !important; }\n  .toolbar, .rail, .edit, .overlay, .toast { display: none !important; }\n  .wrap, .stage, #sheets { display: block; gap: 0; }\n  .sheet {\n    --sheet: #ffffff; --card: #f6f8fb; --ink: #14213d; --muted: #566277; --line: #c9d1de; --accent: #0b6e6e; --accent-ink: #fff;\n    --t0: #dcf0ec; --t1: #e1e7fb; --t2: #f6e1ec; --t3: #e9f2d0;\n    width: 210mm; height: 297mm; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always;\n  }\n  .sheet:last-child { break-after: auto; page-break-after: auto; }\n  .slot .plus, .slot .slot-text { display: none; }\n  .word { font-size: 17px; }\n  .mean { font-size: 10px; line-height: 1.3; }\n  .rel { font-size: 8.5px; line-height: 1.25; padding-right: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n}\n\u003c/style>\n\n\u003cmain class=\"wrap\">\n  \u003cnav class=\"rail\" id=\"rail\" aria-label=\"Tools\">\n    \n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn\" id=\"addMany\" data-tip=\"Add many words\" aria-label=\"Add many words\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4 6h10M4 12h10M4 18h6\"/>\u003cpath d=\"M18 13v7M14.5 16.5h7\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn\" id=\"addSheet\" data-tip=\"Add sheet (+18 words)\" aria-label=\"Add sheet, 18 more words\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M7 3h7l4 4v14H7z\"/>\u003cpath d=\"M14 3v4h4\"/>\u003cpath d=\"M12.5 12v6M9.5 15h6\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-sep\">\u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn\" id=\"slideshow\" data-tip=\"Slideshow\" aria-label=\"Slideshow\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/>\u003cpath d=\"M10 9.5v5l4.5-2.5z\" fill=\"currentColor\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn\" id=\"quizBtn\" data-tip=\"Quiz: spelling and meaning\" aria-label=\"Quiz: spelling and meaning\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1.1.9-1.1 1.7M12 17h.01\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-item\">\n      \u003cbutton type=\"button\" class=\"rbtn\" id=\"voiceBtn\" data-tip=\"Choose voice\" aria-label=\"Choose voice\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/>\u003cpath d=\"M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6\"/>\u003c/svg>\u003c/button>\n      \u003cdiv class=\"flyout\" id=\"flyout\" hidden>\n        \u003clabel for=\"voice\">Voice\u003c/label>\n        \u003cselect id=\"voice\">\u003c/select>\n        \u003cdiv class=\"vquick\">\u003cbutton type=\"button\" class=\"btn\" id=\"vFemale\">Indian female\u003c/button>\u003cbutton type=\"button\" class=\"btn\" id=\"vMale\">Indian male\u003c/button>\u003c/div>\n        \u003cp id=\"voiceNote\">\u003c/p>\n        \u003cdiv class=\"vsave\">\u003cbutton type=\"button\" class=\"btn\" id=\"vSample\">Hear sample\u003c/button>\u003cbutton type=\"button\" class=\"btn primary\" id=\"vSave\">Done\u003c/button>\u003c/div>\n        \u003cp class=\"vstatus\" id=\"voiceStatus\">\u003c/p>\n        \u003cp>Voices come from your browser. The voice you choose applies to every word straight away. For an exact sound, record your own voice on a card.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn\" id=\"spellBtn\" data-tip=\"Say the letters: on\" aria-label=\"Say the letters of each word\" aria-pressed=\"true\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ctext x=\"12\" y=\"14.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"800\" fill=\"currentColor\" stroke=\"none\" font-family=\"Lexend, Arial, sans-serif\">ABC\u003c/text>\u003cpath d=\"M6 19h2.5M10.8 19h2.5M15.5 19h2.5\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn\" id=\"slow\" data-tip=\"Slow voice: off\" aria-label=\"Slow voice\" aria-pressed=\"false\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M3 16a7.5 6.5 0 0 1 15 0z\"/>\u003ccircle cx=\"20.5\" cy=\"13\" r=\"1.8\"/>\u003cpath d=\"M6.5 16v3M14.5 16v3\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn\" id=\"keysBtn\" data-tip=\"Keyboard shortcuts\" aria-label=\"Keyboard shortcuts\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"6\" width=\"18\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M7 10h.01M11 10h.01M15 10h.01M7 14h10\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-sep\">\u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn danger\" id=\"clearAll\" data-tip=\"Clear all\" aria-label=\"Clear all\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6\"/>\u003c/svg>\u003c/button>\u003c/div>\n  \u003c/nav>\n  \u003cdiv class=\"stage\">\n    \u003cdiv id=\"sheets\">\u003c/div>\n  \u003c/div>\n\u003c/main>\n\n\u003cdiv class=\"overlay\" id=\"editor\" hidden>\n  \u003cform class=\"panel\" id=\"edForm\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"edTitle\" novalidate>\n    \u003cdiv class=\"panel-head\">\n      \u003ch2 id=\"edTitle\">Add word\u003c/h2>\n      \u003cbutton type=\"button\" class=\"icon-btn\" id=\"edClose\" aria-label=\"Close\">&times;\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"edWord\">Word\u003c/label>\n      \u003cdiv class=\"row\">\n        \u003cinput type=\"text\" id=\"edWord\" maxlength=\"28\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"e.g. Pneumonia\">\n        \u003cbutton type=\"button\" class=\"btn\" id=\"edHear\">Hear it\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"edSay\">How to say it \u003cspan class=\"opt\">optional\u003c/span>\u003c/label>\n      \u003cinput type=\"text\" id=\"edSay\" maxlength=\"30\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"e.g. new-MOH-nya\">\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"edMean\">Meaning\u003c/label>\n      \u003ctextarea id=\"edMean\" rows=\"3\" maxlength=\"90\" placeholder=\"A short, simple meaning students can read at a glance.\">\u003c/textarea>\n      \u003cspan class=\"count\" id=\"edCount\">0 / 90\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"edSyn\">Synonyms \u003cspan class=\"opt\">words with a similar meaning, separated by commas\u003c/span>\u003c/label>\n      \u003cinput type=\"text\" id=\"edSyn\" maxlength=\"70\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"e.g. large, huge, big\">\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"edAnt\">Antonyms \u003cspan class=\"opt\">opposite words, separated by commas\u003c/span>\u003c/label>\n      \u003cinput type=\"text\" id=\"edAnt\" maxlength=\"70\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"e.g. small, tiny\">\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003cspan class=\"lbl\">Picture \u003cspan class=\"opt\">optional\u003c/span>\u003c/span>\n      \u003cdiv class=\"pic-row\">\n        \u003cdiv class=\"pic\" id=\"edPic\">\u003c/div>\n        \u003cdiv class=\"pic-actions\">\n          \u003clabel class=\"btn\" for=\"edFile\">Choose picture\u003c/label>\n          \u003cinput type=\"file\" id=\"edFile\" class=\"sr\" accept=\"image/*\">\n          \u003cbutton type=\"button\" class=\"btn ghost\" id=\"edPicRemove\">Remove picture\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003cspan class=\"lbl\">Your own voice \u003cspan class=\"opt\">optional, plays instead of the computer voice\u003c/span>\u003c/span>\n      \u003cdiv class=\"aud-row\">\n        \u003cbutton type=\"button\" class=\"btn\" id=\"edRec\">Record\u003c/button>\n        \u003clabel class=\"btn\" for=\"edAudFile\">Upload audio\u003c/label>\n        \u003cinput type=\"file\" id=\"edAudFile\" class=\"sr\" accept=\"audio/*\">\n        \u003cbutton type=\"button\" class=\"btn\" id=\"edAudPlay\" hidden>Play\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn ghost\" id=\"edAudRemove\" hidden>Remove\u003c/button>\n      \u003c/div>\n      \u003cspan class=\"aud-state\" id=\"edAudState\">\u003c/span>\n    \u003c/div>\n    \u003cp class=\"err\" id=\"edErr\" role=\"alert\" hidden>\u003c/p>\n    \u003cdiv class=\"panel-foot\">\n      \u003cbutton type=\"button\" class=\"btn danger\" id=\"edDelete\">Delete word\u003c/button>\n      \u003cspan class=\"grow\">\u003c/span>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"edCancel\">Cancel\u003c/button>\n      \u003cbutton type=\"submit\" class=\"btn primary\">Save word\u003c/button>\n    \u003c/div>\n  \u003c/form>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"keys\" hidden>\n  \u003csection class=\"panel wide\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"kbTitle\">\n    \u003cdiv class=\"panel-head\">\n      \u003ch2 id=\"kbTitle\">Keyboard shortcuts\u003c/h2>\n      \u003cbutton type=\"button\" class=\"icon-btn\" id=\"kbClose\" aria-label=\"Close\">&times;\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"kb-cols\">\n      \u003cdiv class=\"kb-group\">\n        \u003ch3>On the cards\u003c/h3>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>0\u003c/kbd> to \u003ckbd>9\u003c/kbd>\u003c/span>\u003cspan>Type a card number to hear that word, its spelling and its meaning. Type two digits for cards 10 and up.\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num Enter\u003c/kbd>\u003c/span>\u003cspan>Start the slideshow with your saved settings\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Esc\u003c/kbd>\u003c/span>\u003cspan>Stop reading\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num /\u003c/kbd> \u003ckbd>?\u003c/kbd>\u003c/span>\u003cspan>Show this list\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"kb-group\">\n        \u003ch3>In the slideshow\u003c/h3>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 6\u003c/kbd> \u003ckbd>&rarr;\u003c/kbd>\u003c/span>\u003cspan>Next word\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 4\u003c/kbd> \u003ckbd>&larr;\u003c/kbd>\u003c/span>\u003cspan>Previous word\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 5\u003c/kbd> \u003ckbd>Space\u003c/kbd>\u003c/span>\u003cspan>Pause or play\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 8\u003c/kbd> \u003ckbd>Num Enter\u003c/kbd>\u003c/span>\u003cspan>Hear this word again\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 7\u003c/kbd>\u003c/span>\u003cspan>Start again from the first word\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num +\u003c/kbd> \u003ckbd>Num &minus;\u003c/kbd>\u003c/span>\u003cspan>Longer or shorter time on each word\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num *\u003c/kbd>\u003c/span>\u003cspan>Slow voice on or off\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num .\u003c/kbd>\u003c/span>\u003cspan>Full screen\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 2\u003c/kbd>\u003c/span>\u003cspan>Slideshow settings\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 0\u003c/kbd> \u003ckbd>Esc\u003c/kbd>\u003c/span>\u003cspan>Close the slideshow\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num /\u003c/kbd>\u003c/span>\u003cspan>Show this list\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"kb-group\">\n        \u003ch3>In the quiz\u003c/h3>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>1\u003c/kbd> to \u003ckbd>4\u003c/kbd> \u003ckbd>Num 1\u003c/kbd> to \u003ckbd>Num 4\u003c/kbd>\u003c/span>\u003cspan>Choose an answer in a meaning question\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Enter\u003c/kbd> \u003ckbd>Num Enter\u003c/kbd>\u003c/span>\u003cspan>Check the spelling, then go to the next question\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Space\u003c/kbd>\u003c/span>\u003cspan>Next question (after answering)\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Esc\u003c/kbd>\u003c/span>\u003cspan>Close the quiz\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cp class=\"bk-help\">Keep Num Lock on so the keypad sends numbers. With Num Lock off, the keypad arrows still work for next and previous.\u003c/p>\n    \u003cdiv class=\"panel-foot\">\u003cspan class=\"grow\">\u003c/span>\u003cbutton type=\"button\" class=\"btn primary\" id=\"kbDone\">Done\u003c/button>\u003c/div>\n  \u003c/section>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"rel\" hidden>\n  \u003cform class=\"panel wide\" id=\"rlForm\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"rlTitle\" novalidate>\n    \u003cdiv class=\"panel-head\">\n      \u003ch2 id=\"rlTitle\">Synonyms and antonyms\u003c/h2>\n      \u003cbutton type=\"button\" class=\"icon-btn\" id=\"rlClose\" aria-label=\"Close\">&times;\u003c/button>\n    \u003c/div>\n    \u003cp class=\"bk-help\">Type words with a similar meaning under \u003cb>Synonyms\u003c/b> and opposite words under \u003cb>Antonyms\u003c/b>, separated by commas. Press Enter to move to the next box, then tap Save.\u003c/p>\n    \u003cdiv class=\"rl-table\">\n      \u003cdiv class=\"rl-head\" aria-hidden=\"true\">\u003cspan>Word\u003c/span>\u003cspan>Synonyms (similar)\u003c/span>\u003cspan>Antonyms (opposite)\u003c/span>\u003c/div>\n      \u003cdiv id=\"rlRows\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel-foot\">\n      \u003cspan class=\"grow\">\u003c/span>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"rlCancel\">Cancel\u003c/button>\n      \u003cbutton type=\"submit\" class=\"btn primary\" id=\"rlSave\">Save\u003c/button>\n    \u003c/div>\n  \u003c/form>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"quiz\" hidden>\n  \u003cform class=\"panel\" id=\"qzSetup\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"qzTitle\" novalidate>\n    \u003cdiv class=\"panel-head\">\n      \u003ch2 id=\"qzTitle\">Quiz\u003c/h2>\n      \u003cbutton type=\"button\" class=\"icon-btn\" id=\"qzClose\" aria-label=\"Close\">&times;\u003c/button>\n    \u003c/div>\n    \u003cp class=\"bk-help\" id=\"qzInfo\">\u003c/p>\n    \u003cdiv class=\"field\">\n      \u003cspan class=\"lbl\">Test the students on\u003c/span>\n      \u003clabel class=\"sm-auto\" for=\"qzSpell\">\u003cinput type=\"checkbox\" id=\"qzSpell\" checked>\u003cspan>\u003cb>Spelling:\u003c/b> they hear the word and type it\u003c/span>\u003c/label>\n      \u003clabel class=\"sm-auto\" for=\"qzMean\">\u003cinput type=\"checkbox\" id=\"qzMean\" checked>\u003cspan>\u003cb>Meaning:\u003c/b> they pick the right meaning for a word\u003c/span>\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"qzCount\">Number of questions\u003c/label>\n      \u003cdiv class=\"ss-rounds\">\u003cinput type=\"number\" id=\"qzCount\" min=\"1\" max=\"99\" value=\"10\" inputmode=\"numeric\">\u003cspan id=\"qzCountOf\">\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003clabel class=\"sm-auto\" for=\"qzSpeak\">\u003cinput type=\"checkbox\" id=\"qzSpeak\" checked>\u003cspan>Say each word aloud when a question appears\u003c/span>\u003c/label>\n    \u003clabel class=\"sm-auto\" for=\"qzShowLen\">\u003cinput type=\"checkbox\" id=\"qzShowLen\" checked>\u003cspan>Show one blank for every letter in spelling questions\u003c/span>\u003c/label>\n    \u003clabel class=\"sm-auto\" for=\"qzTeach\">\u003cinput type=\"checkbox\" id=\"qzTeach\" checked>\u003cspan>Say the correct answer after each question\u003c/span>\u003c/label>\n    \u003cp class=\"err\" id=\"qzWarn\" role=\"alert\" hidden>\u003c/p>\n    \u003cdiv class=\"panel-foot\">\n      \u003cspan class=\"grow\">\u003c/span>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"qzCancel\">Cancel\u003c/button>\n      \u003cbutton type=\"submit\" class=\"btn primary\" id=\"qzStart\">Start quiz\u003c/button>\n    \u003c/div>\n  \u003c/form>\n  \u003csection class=\"ss-stage\" id=\"qzStage\" hidden aria-label=\"Quiz\">\n    \u003cdiv class=\"ss-bar\">\u003cdiv id=\"qzBar\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"ss-top\">\n      \u003cspan id=\"qzMeta\">\u003c/span>\n      \u003cspan class=\"qz-score\" id=\"qzScore\">\u003c/span>\n      \u003cspan class=\"ss-top-actions\">\u003cbutton type=\"button\" class=\"icon-btn\" id=\"qzExit\" aria-label=\"Close quiz\" title=\"Close quiz\">&times;\u003c/button>\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"qz-body\" id=\"qzBody\">\u003c/div>\n  \u003c/section>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"show\" hidden>\n  \u003csection class=\"panel\" id=\"ssSetup\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"ssTitle\">\n    \u003cdiv class=\"panel-head\">\n      \u003ch2 id=\"ssTitle\">Slideshow\u003c/h2>\n      \u003cbutton type=\"button\" class=\"icon-btn\" id=\"ssClose\" aria-label=\"Close\">&times;\u003c/button>\n    \u003c/div>\n    \u003cp class=\"bk-help\" id=\"ssInfo\">\u003c/p>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"ssSec\">Time on each word\u003c/label>\n      \u003cdiv class=\"ss-range\">\u003cinput type=\"range\" id=\"ssSec\" min=\"2\" max=\"30\" step=\"1\" value=\"6\">\u003coutput id=\"ssSecOut\" for=\"ssSec\">6 s\u003c/output>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"ssRounds\">Repeat the whole list\u003c/label>\n      \u003cdiv class=\"ss-rounds\">\n        \u003cinput type=\"number\" id=\"ssRounds\" min=\"1\" max=\"99\" value=\"3\" inputmode=\"numeric\">\n        \u003cspan>times\u003c/span>\n        \u003clabel class=\"sm-auto\" for=\"ssForever\">\u003cinput type=\"checkbox\" id=\"ssForever\">\u003cspan>Repeat until I stop\u003c/span>\u003c/label>\n      \u003c/div>\n    \u003c/div>\n    \u003clabel class=\"sm-auto\" for=\"ssSpeak\">\u003cinput type=\"checkbox\" id=\"ssSpeak\" checked>\u003cspan>Say each word aloud (the slide waits until it finishes)\u003c/span>\u003c/label>\n    \u003clabel class=\"sm-auto\" for=\"ssSpell\">\u003cinput type=\"checkbox\" id=\"ssSpell\" checked>\u003cspan>Spell the letters one by one\u003c/span>\u003c/label>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"ssAgain\">Say the word again at the end\u003c/label>\n      \u003cdiv class=\"ss-rounds\">\u003cinput type=\"number\" id=\"ssAgain\" min=\"1\" max=\"5\" value=\"1\" inputmode=\"numeric\">\u003cspan>times\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003clabel class=\"sm-auto\" for=\"ssMeaning\">\u003cinput type=\"checkbox\" id=\"ssMeaning\" checked>\u003cspan>Read the meaning at the end (\"City means a large town\")\u003c/span>\u003c/label>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"ssMeanTimes\">Say the meaning\u003c/label>\n      \u003cdiv class=\"ss-rounds\">\u003cinput type=\"number\" id=\"ssMeanTimes\" min=\"1\" max=\"5\" value=\"1\" inputmode=\"numeric\">\u003cspan>times\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003clabel class=\"sm-auto\" for=\"ssRelated\">\u003cinput type=\"checkbox\" id=\"ssRelated\" checked>\u003cspan>Read the synonyms and antonyms after the meaning\u003c/span>\u003c/label>\n    \u003clabel class=\"sm-auto\" for=\"ssShuffle\">\u003cinput type=\"checkbox\" id=\"ssShuffle\">\u003cspan>Shuffle the order in every round\u003c/span>\u003c/label>\n    \u003cdiv class=\"panel-foot\">\n      \u003cspan class=\"grow\">\u003c/span>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"ssCancel\">Cancel\u003c/button>\n      \u003cbutton type=\"button\" class=\"btn primary\" id=\"ssStart\">Start slideshow\u003c/button>\n    \u003c/div>\n  \u003c/section>\n  \u003csection class=\"ss-stage\" id=\"ssStage\" hidden aria-label=\"Slideshow\">\n    \u003cdiv class=\"ss-bar\">\u003cdiv id=\"ssBar\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"ss-top\">\n      \u003cspan id=\"ssMeta\">\u003c/span>\n      \u003cspan class=\"ss-top-actions\">\n        \u003cbutton type=\"button\" class=\"icon-btn\" id=\"ssKeys\" aria-label=\"Keyboard shortcuts\" title=\"Keyboard shortcuts\">&#9000;\u003c/button>\n        \u003cbutton type=\"button\" class=\"icon-btn\" id=\"ssFull\" aria-label=\"Full screen\" title=\"Full screen\">&#x26F6;\u003c/button>\n        \u003cbutton type=\"button\" class=\"icon-btn\" id=\"ssExit\" aria-label=\"Close slideshow\" title=\"Close\">&times;\u003c/button>\n      \u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"ss-body\" id=\"ssBody\" aria-live=\"polite\">\u003c/div>\n    \u003cdiv class=\"ss-controls\">\n      \u003cbutton type=\"button\" class=\"ss-btn\" id=\"ssPrev\" aria-label=\"Previous word\" title=\"Previous word\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M15 5l-7 7 7 7\"/>\u003c/svg>\u003c/button>\n      \u003cbutton type=\"button\" class=\"ss-btn main\" id=\"ssPlay\" aria-label=\"Pause\" title=\"Pause\">\u003c/button>\n      \u003cbutton type=\"button\" class=\"ss-btn\" id=\"ssNext\" aria-label=\"Next word\" title=\"Next word\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 5l7 7-7 7\"/>\u003c/svg>\u003c/button>\n      \u003cbutton type=\"button\" class=\"ss-btn\" id=\"ssHear\" aria-label=\"Say this word again\" title=\"Say this word again\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" aria-hidden=\"true\">\u003cpath d=\"M4 9v6h4l5 4V5L8 9H4z\" fill=\"currentColor\"/>\u003cpath d=\"M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003c/svg>\u003c/button>\n      \u003cbutton type=\"button\" class=\"ss-btn\" id=\"ssGear\" aria-label=\"Slideshow settings\" title=\"Slideshow settings\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4 7h10M18 7h2M4 17h2M10 17h10\"/>\u003ccircle cx=\"16\" cy=\"7\" r=\"2\"/>\u003ccircle cx=\"8\" cy=\"17\" r=\"2\"/>\u003c/svg>\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"smart\" hidden>\n  \u003cform class=\"panel wide\" id=\"smForm\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"smTitle\" novalidate>\n    \u003cdiv class=\"panel-head\">\n      \u003ch2 id=\"smTitle\">Paste from ChatGPT\u003c/h2>\n      \u003cbutton type=\"button\" class=\"icon-btn\" id=\"smClose\" aria-label=\"Close\">&times;\u003c/button>\n    \u003c/div>\n    \u003cp class=\"bk-help\">Copy ChatGPT's list of hard words and paste it below. The words, how to say them and their meanings are picked out for you, so there is nothing to type. Tables, numbered lists and \"word - meaning\" lines all work.\u003c/p>\n    \u003cdiv class=\"sm-tools\">\n      \u003cbutton type=\"button\" class=\"btn\" id=\"smCopy\">Copy prompt for ChatGPT\u003c/button>\n      \u003clabel class=\"sm-auto\" for=\"smAuto\">\u003cinput type=\"checkbox\" id=\"smAuto\" checked>\u003cspan>Add words as soon as I paste\u003c/span>\u003c/label>\n    \u003c/div>\n    \u003cdetails class=\"bk-paste sm-prompt\">\n      \u003csummary>See the prompt\u003c/summary>\n      \u003ctextarea id=\"smPrompt\" rows=\"4\" readonly spellcheck=\"false\">\u003c/textarea>\n    \u003c/details>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"smPaste\">ChatGPT's list\u003c/label>\n      \u003ctextarea id=\"smPaste\" class=\"sm-ta\" rows=\"7\" spellcheck=\"false\" placeholder=\"Paste here. For example:&#10;1. Pneumonia (new-MOH-nya) - a serious illness of the lungs&#10;2. Colonel | KUR-nul | a senior army officer\">\u003c/textarea>\n    \u003c/div>\n    \u003col class=\"sm-list\" id=\"smPreview\" hidden>\u003c/ol>\n    \u003cp class=\"bk-status\" id=\"smStatus\" role=\"status\">\u003c/p>\n    \u003cdiv class=\"panel-foot\">\n      \u003cbutton type=\"button\" class=\"btn\" id=\"smReview\">Review in table\u003c/button>\n      \u003cspan class=\"grow\">\u003c/span>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"smCancel\">Cancel\u003c/button>\n      \u003cbutton type=\"submit\" class=\"btn primary\" id=\"smAdd\" disabled>Add words\u003c/button>\n    \u003c/div>\n  \u003c/form>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"bulk\" hidden>\n  \u003cform class=\"panel wide\" id=\"bkForm\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"bkTitle\" novalidate>\n    \u003cdiv class=\"panel-head\">\n      \u003ch2 id=\"bkTitle\">Add many words\u003c/h2>\n      \u003cbutton type=\"button\" class=\"icon-btn\" id=\"bkClose\" aria-label=\"Close\">&times;\u003c/button>\n    \u003c/div>\n    \u003cp class=\"bk-help\">Type each word with how to say it and its meaning. Words go into the empty cards in order, and a new sheet is added if the page is full. Press Enter to move to the next row.\u003c/p>\n    \u003cdiv class=\"bk-table\">\n      \u003cdiv class=\"bk-head\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003cspan>Word\u003c/span>\u003cspan>How to say it\u003c/span>\u003cspan>Meaning\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n      \u003cdiv id=\"bkRows\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"bk-tools\">\n      \u003cbutton type=\"button\" class=\"btn\" id=\"bkAddRow\">+ Add row\u003c/button>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"bkAdd5\">+ 5 rows\u003c/button>\n    \u003c/div>\n    \u003cdetails class=\"bk-paste\">\n      \u003csummary>Paste a list instead\u003c/summary>\n      \u003cp class=\"bk-help\">One word per line: \u003cb>word | how to say it | meaning | synonyms | antonyms\u003c/b> (the last two are optional). Lines copied from Excel or Google Sheets also work.\u003c/p>\n      \u003ctextarea id=\"bkPaste\" rows=\"5\" spellcheck=\"false\" placeholder=\"Pneumonia | new-MOH-nya | A serious illness of the lungs&#10;Colonel | KUR-nul | A senior army officer\">\u003c/textarea>\n      \u003cdiv>\u003cbutton type=\"button\" class=\"btn\" id=\"bkFill\">Fill rows from list\u003c/button>\u003c/div>\n    \u003c/details>\n    \u003cp class=\"bk-status\" id=\"bkStatus\" role=\"status\">\u003c/p>\n    \u003cdiv class=\"panel-foot\">\n      \u003cspan class=\"grow\">\u003c/span>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"bkCancel\">Cancel\u003c/button>\n      \u003cbutton type=\"submit\" class=\"btn primary\" id=\"bkSave\">Add words\u003c/button>\n    \u003c/div>\n  \u003c/form>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\n\u003cstyle>:root{--h1:#0f766e;--h2:#2563eb;--hi:\"\\1F5E3\\FE0F\"}.head{position:relative;overflow:hidden;align-items:center!important;gap:14px!important;padding:16px 18px!important;border:0!important;border-radius:18px;background:linear-gradient(120deg,var(--h1),var(--h2));color:#fff;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,.12)}.head::before{content:var(--hi);flex:none;display:grid;place-items:center;width:58px;height:58px;font-size:32px;border-radius:16px;background:rgba(255,255,255,.22)}.head::after{content:\"\";position:absolute;right:-34p e: clamp(14px, 1.4vw, 20px); }\n.ss-done { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }\n.ss-done h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(32px, 5vw, 64px); }\n.ss-done p { margin: 0; font-size: clamp(16px, 1.6vw, 22px); color: var(--muted); }\n.ss-controls { display: flex; justify-content: center; align-items: center; gap: 14px; padding: 14px 0 20px; flex: none; flex-wrap: wrap; }\n.ss-btn { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: grid; place-items: center; }\n.ss-btn:hover { border-color: var(--accent); color: var(--accent); }\n.ss-btn.main { width: 68px; height: 68px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }\n.ss-btn.main:hover { color: var(--accent-ink); filter: brightness(1.1); }\n.ss-btn.playing { animation: pulse 1s ease-out infinite; }\n@media (max-width: 800px) {\n  .ss-body { grid-template-columns: minmax(0, 1fr); text-align: center; align-content: center; gap: 16px; }\n  .ss-left { align-items: center; }\n  .ss-chips { justify-content: center; }\n  .ss-word { font-size: clamp(40px, 14vw, 90px); }\n}\n\n.toast {\n  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); z-index: 60; background: var(--ink); color: var(--sheet);\n  padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px);\n}\n.toast.show { opacity: 1; transform: translate(-50%, 0); }\n.toast.has-act { pointer-events: auto; }\n.toast-act { margin-left: 12px; padding: 0; background: transparent; border: 0; color: inherit; font: inherit; font-weight: 600; text-decoration: underline; }\n@media (prefers-reduced-motion: reduce) { .toast, .rbtn::after { transition: none; } .speak.playing, .ss-btn.playing { animation: none; } }\n\n/* Narrow screens */\n@media (max-width: 999px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n@media (max-width: 699px) {\n  .wrap { gap: 10px; }\n  .rail { top: 10px; padding: 6px; gap: 4px; border-radius: 12px; }\n  .rbtn { width: 38px; height: 38px; }\n  .sheet { padding: 14px 14px 12px; }\n  .grid { grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto; }\n  .slot { min-height: 70px; }\n}\n\n/* Printing: one A4 sheet per page, 2 columns x 6 rows */\n@media print {\n  @page { size: A4; margin: 0; }\n  body { background: #fff !important; padding: 0 !important; }\n  .rail, .edit, .overlay, .toast { display: none !important; }\n  .wrap, .stage, #sheets { display: block; gap: 0; }\n  .sheet {\n    --sheet: #fff; --card: #f6f8fb; --ink: #14213d; --muted: #566277; --line: #c9d1de; --syn: #146c43; --syn-bg: #e2f4ea; --ant: #a8321f; --ant-bg: #fdebe7;\n    width: 210mm; height: 297mm; min-height: 0; padding: 10mm 11mm 7mm; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; overflow: hidden;\n  }\n  .sheet:last-child { break-after: auto; page-break-after: auto; }\n  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(6, minmax(0, 1fr)); grid-auto-rows: auto; gap: 3mm 4mm; }\n  .card { padding: 2.5mm 3mm; gap: 1.5mm; border-radius: 8px; overflow: hidden; }\n  .word { font-size: 17px; } .num { min-width: 18px; height: 18px; font-size: 9px; }\n  .speak { width: 26px; height: 26px; } .speak svg { width: 14px; height: 14px; }\n  .sec { padding: 1.5mm 2.5mm; } .sec h4 { font-size: 8px; margin-bottom: 2px; }\n  .chips { gap: 3px; } .chips span { font-size: 9.5px; padding: 0 6px; }\n  .slot .plus, .slot .slot-text { display: none; }\n}\n\u003c/style>\n\u003cstyle>#bulk .bk-head, #bulk .bk-row { grid-template-columns: 26px minmax(0, 1fr) minmax(0, 2.4fr) 32px !important; } #bulk .bk-a, #bulk .bk-head span:nth-child(4) { display: none !important; } @media (max-width: 700px) { #bulk .bk-row { grid-template-columns: 26px minmax(0, 1fr) 32px !important; } }\u003c/style>\n\n\u003cmain class=\"wrap\">\n  \u003cnav class=\"rail\" aria-label=\"Tools\">\n    \n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn\" id=\"addMany\" data-tip=\"Add many words\" aria-label=\"Add many words\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4 6h10M4 12h10M4 18h6\"/>\u003cpath d=\"M18 13v7M14.5 16.5h7\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn\" id=\"addSheet\" data-tip=\"Add sheet (+12 words)\" aria-label=\"Add sheet, 12 more words\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M7 3h7l4 4v14H7z\"/>\u003cpath d=\"M14 3v4h4\"/>\u003cpath d=\"M12.5 12v6M9.5 15h6\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-sep\">\u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn\" id=\"slideshow\" data-tip=\"Presentation mode\" aria-label=\"Presentation mode\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/>\u003cpath d=\"M10 9.5v5l4.5-2.5z\" fill=\"currentColor\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-item\">\n      \u003cbutton type=\"button\" class=\"rbtn\" id=\"voiceBtn\" data-tip=\"Choose voice\" aria-label=\"Choose voice\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/>\u003cpath d=\"M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6\"/>\u003c/svg>\u003c/button>\n      \u003cdiv class=\"flyout\" id=\"flyout\" hidden>\n        \u003clabel for=\"voice\">Voice\u003c/label>\n        \u003cselect id=\"voice\">\u003c/select>\n        \u003cbutton type=\"button\" class=\"btn\" id=\"vSample\">Hear sample\u003c/button>\n        \u003cp id=\"voiceStatus\">\u003c/p>\n        \u003cp>The voice you choose applies straight away. Voices come from your browser, so they differ between devices.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn\" id=\"slow\" data-tip=\"Slow voice: off\" aria-label=\"Slow voice\" aria-pressed=\"false\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M3 16a7.5 6.5 0 0 1 15 0z\"/>\u003ccircle cx=\"20.5\" cy=\"13\" r=\"1.8\"/>\u003cpath d=\"M6.5 16v3M14.5 16v3\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn\" id=\"keysBtn\" data-tip=\"Keyboard shortcuts\" aria-label=\"Keyboard shortcuts\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"6\" width=\"18\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M7 10h.01M11 10h.01M15 10h.01M7 14h10\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-sep\">\u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn danger\" id=\"clearAll\" data-tip=\"Clear all\" aria-label=\"Clear all\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6\"/>\u003c/svg>\u003c/button>\u003c/div>\n  \u003c/nav>\n  \u003cdiv class=\"stage\">\u003cdiv id=\"sheets\">\u003c/div>\u003c/div>\n\u003c/main>\n\n\u003cdiv class=\"overlay\" id=\"editor\" hidden>\n  \u003cform class=\"panel\" id=\"edForm\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"edTitle\" novalidate>\n    \u003cdiv class=\"panel-head\">\u003ch2 id=\"edTitle\">Add word\u003c/h2>\u003cbutton type=\"button\" class=\"icon-btn\" id=\"edClose\" aria-label=\"Close\">&times;\u003c/button>\u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"edWord\">Word\u003c/label>\n      \u003cdiv class=\"row\">\u003cinput type=\"text\" id=\"edWord\" maxlength=\"28\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"e.g. Brave\">\u003cbutton type=\"button\" class=\"btn\" id=\"edHear\">Hear it\u003c/button>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"edSyn\">Synonyms \u003cspan class=\"opt\">words with a similar meaning, separated by commas\u003c/span>\u003c/label>\n      \u003cinput type=\"text\" id=\"edSyn\" maxlength=\"90\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"e.g. courageous, bold, fearless\">\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"edAnt\">Antonyms \u003cspan class=\"opt\">opposite words, separated by commas\u003c/span>\u003c/label>\n      \u003cinput type=\"text\" id=\"edAnt\" maxlength=\"90\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"e.g. cowardly, timid\">\n    \u003c/div>\n    \u003cp class=\"err\" id=\"edErr\" role=\"alert\" hidden>\u003c/p>\n    \u003cdiv class=\"panel-foot\">\n      \u003cbutton type=\"button\" class=\"btn danger\" id=\"edDelete\">Delete word\u003c/button>\u003cspan class=\"grow\">\u003c/span>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"edCancel\">Cancel\u003c/button>\u003cbutton type=\"submit\" class=\"btn primary\">Save word\u003c/button>\n    \u003c/div>\n  \u003c/form>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"bulk\" hidden>\n  \u003cform class=\"panel wide\" id=\"bkForm\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"bkTitle\" novalidate>\n    \u003cdiv class=\"panel-head\">\u003ch2 id=\"bkTitle\">Add many words\u003c/h2>\u003cbutton type=\"button\" class=\"icon-btn\" id=\"bkClose\" aria-label=\"Close\">&times;\u003c/button>\u003c/div>\n    \u003cp class=\"help\">Type each word with its own synonyms, separated by commas. Press Enter to move to the next box. The words fill the empty cards in order, and a new sheet is added if the page is full.\u003c/p>\n    \u003cdiv>\n      \u003cdiv class=\"bk-head\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003cspan>Word\u003c/span>\u003cspan>Synonyms (similar)\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n      \u003cdiv id=\"bkRows\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"bk-tools\">\u003cbutton type=\"button\" class=\"btn\" id=\"bkAddRow\">+ Add row\u003c/button>\u003cbutton type=\"button\" class=\"btn\" id=\"bkAdd5\">+ 5 rows\u003c/button>\u003c/div>\n    \u003cdetails class=\"paste\" id=\"bkPasteBox\">\n      \u003csummary>Paste a list from ChatGPT instead\u003c/summary>\n      \u003cp class=\"help\">Copy ChatGPT's list and paste it below. Words and their synonyms are picked out for you. Tables, numbered lists, and lines like \u003cb>Word | synonyms\u003c/b> all work.\u003c/p>\n      \u003cdiv class=\"row\">\u003cbutton type=\"button\" class=\"btn\" id=\"bkCopy\">Copy prompt for ChatGPT\u003c/button>\u003c/div>\n      \u003clabel class=\"chk\" for=\"bkAuto\">\u003cinput type=\"checkbox\" id=\"bkAuto\" checked>\u003cspan>Add the words as soon as I paste\u003c/span>\u003c/label>\n      \u003ctextarea id=\"bkPaste\" rows=\"5\" spellcheck=\"false\" placeholder=\"Happy | joyful, cheerful, glad | sad, unhappy, gloomy&#10;Brave | courageous, bold | cowardly, timid\">\u003c/textarea>\n      \u003cdiv>\u003cbutton type=\"button\" class=\"btn\" id=\"bkFill\">Fill rows from list\u003c/button>\u003c/div>\n    \u003c/details>\n    \u003cp class=\"status\" id=\"bkStatus\" role=\"status\">\u003c/p>\n    \u003cdiv class=\"panel-foot\">\u003cspan class=\"grow\">\u003c/span>\u003cbutton type=\"button\" class=\"btn\" id=\"bkCancel\">Cancel\u003c/button>\u003cbutton type=\"submit\" class=\"btn primary\" id=\"bkSave\">Add words\u003c/button>\u003c/div>\n  \u003c/form>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"keys\" hidden>\n  \u003csection class=\"panel wide\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"kbTitle\">\n    \u003cdiv class=\"panel-head\">\u003ch2 id=\"kbTitle\">Keyboard shortcuts\u003c/h2>\u003cbutton type=\"button\" class=\"icon-btn\" id=\"kbClose\" aria-label=\"Close\">&times;\u003c/button>\u003c/div>\n    \u003cdiv class=\"kb-cols\">\n      \u003cdiv class=\"kb-group\">\n        \u003ch3>On the cards\u003c/h3>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>0\u003c/kbd> to \u003ckbd>9\u003c/kbd>\u003c/span>\u003cspan>Type a card number to hear that word and its synonyms. Type two digits for cards 10 and up.\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num Enter\u003c/kbd>\u003c/span>\u003cspan>Start presentation mode with your saved settings\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Esc\u003c/kbd>\u003c/span>\u003cspan>Stop reading\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num /\u003c/kbd> \u003ckbd>?\u003c/kbd>\u003c/span>\u003cspan>Show this list\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"kb-group\">\n        \u003ch3>In presentation mode\u003c/h3>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 6\u003c/kbd> \u003ckbd>&rarr;\u003c/kbd>\u003c/span>\u003cspan>Next word\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 4\u003c/kbd> \u003ckbd>&larr;\u003c/kbd>\u003c/span>\u003cspan>Previous word\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 5\u003c/kbd> \u003ckbd>Space\u003c/kbd>\u003c/span>\u003cspan>Pause or play\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 8\u003c/kbd> \u003ckbd>Num Enter\u003c/kbd>\u003c/span>\u003cspan>Hear this word again\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 7\u003c/kbd>\u003c/span>\u003cspan>Start again from the first word\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num +\u003c/kbd> \u003ckbd>Num &minus;\u003c/kbd>\u003c/span>\u003cspan>Longer or shorter time on each word\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num *\u003c/kbd>\u003c/span>\u003cspan>Slow voice on or off\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num .\u003c/kbd>\u003c/span>\u003cspan>Full screen\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 2\u003c/kbd>\u003c/span>\u003cspan>Presentation settings\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 0\u003c/kbd> \u003ckbd>Esc\u003c/kbd>\u003c/span>\u003cspan>Close presentation mode\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cp class=\"help\">Keep Num Lock on so the keypad sends numbers.\u003c/p>\n    \u003cdiv class=\"panel-foot\">\u003cspan class=\"grow\">\u003c/span>\u003cbutton type=\"button\" class=\"btn primary\" id=\"kbDone\">Done\u003c/button>\u003c/div>\n  \u003c/section>\n\u003c/div>\n\n\u003cd  10h.01M11 10h.01M15 10h.01M7 14h10\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-sep\">\u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn danger\" id=\"clearAll\" data-tip=\"Clear all\" aria-label=\"Clear all\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6\"/>\u003c/svg>\u003c/button>\u003c/div>\n  \u003c/nav>\n  \u003cdiv class=\"stage\">\u003cdiv id=\"sheets\">\u003c/div>\u003c/div>\n\u003c/main>\n\n\u003cdiv class=\"overlay\" id=\"editor\" hidden>\n  \u003cform class=\"panel\" id=\"edForm\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"edTitle\" novalidate>\n    \u003cdiv class=\"panel-head\">\u003ch2 id=\"edTitle\">Add word\u003c/h2>\u003cbutton type=\"button\" class=\"icon-btn\" id=\"edClose\" aria-label=\"Close\">&times;\u003c/button>\u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"edWord\">Word\u003c/label>\n      \u003cdiv class=\"row\">\u003cinput type=\"text\" id=\"edWord\" maxlength=\"28\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"e.g. Brave\">\u003cbutton type=\"button\" class=\"btn\" id=\"edHear\">Hear it\u003c/button>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"edSyn\">Synonyms \u003cspan class=\"opt\">words with a similar meaning, separated by commas\u003c/span>\u003c/label>\n      \u003cinput type=\"text\" id=\"edSyn\" maxlength=\"90\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"e.g. courageous, bold, fearless\">\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"edAnt\">Antonyms \u003cspan class=\"opt\">opposite words, separated by commas\u003c/span>\u003c/label>\n      \u003cinput type=\"text\" id=\"edAnt\" maxlength=\"90\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"e.g. cowardly, timid\">\n    \u003c/div>\n    \u003cp class=\"err\" id=\"edErr\" role=\"alert\" hidden>\u003c/p>\n    \u003cdiv class=\"panel-foot\">\n      \u003cbutton type=\"button\" class=\"btn danger\" id=\"edDelete\">Delete word\u003c/button>\u003cspan class=\"grow\">\u003c/span>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"edCancel\">Cancel\u003c/button>\u003cbutton type=\"submit\" class=\"btn primary\">Save word\u003c/button>\n    \u003c/div>\n  \u003c/form>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"bulk\" hidden>\n  \u003cform class=\"panel wide\" id=\"bkForm\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"bkTitle\" novalidate>\n    \u003cdiv class=\"panel-head\">\u003ch2 id=\"bkTitle\">Add many words\u003c/h2>\u003cbutton type=\"button\" class=\"icon-btn\" id=\"bkClose\" aria-label=\"Close\">&times;\u003c/button>\u003c/div>\n    \u003cp class=\"help\">Type each word with its own antonyms, separated by commas. Press Enter to move to the next box. The words fill the empty cards in order, and a new sheet is added if the page is full.\u003c/p>\n    \u003cdiv>\n      \u003cdiv class=\"bk-head\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003cspan>Word\u003c/span>\u003cspan>Antonyms (opposite)\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n      \u003cdiv id=\"bkRows\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"bk-tools\">\u003cbutton type=\"button\" class=\"btn\" id=\"bkAddRow\">+ Add row\u003c/button>\u003cbutton type=\"button\" class=\"btn\" id=\"bkAdd5\">+ 5 rows\u003c/button>\u003c/div>\n    \u003cdetails class=\"paste\" id=\"bkPasteBox\">\n      \u003csummary>Paste a list from ChatGPT instead\u003c/summary>\n      \u003cp class=\"help\">Copy ChatGPT's list and paste it below. Words and their antonyms are picked out for you. Tables, numbered lists, and lines like \u003cb>Word | antonyms\u003c/b> all work.\u003c/p>\n      \u003cdiv class=\"row\">\u003cbutton type=\"button\" class=\"btn\" id=\"bkCopy\">Copy prompt for ChatGPT\u003c/button>\u003c/div>\n      \u003clabel class=\"chk\" for=\"bkAuto\">\u003cinput type=\"checkbox\" id=\"bkAuto\" checked>\u003cspan>Add the words as soon as I paste\u003c/span>\u003c/label>\n      \u003ctextarea id=\"bkPaste\" rows=\"5\" spellcheck=\"false\" placeholder=\"Happy | joyful, cheerful, glad | sad, unhappy, gloomy&#10;Brave | courageous, bold | cowardly, timid\">\u003c/textarea>\n      \u003cdiv>\u003cbutton type=\"button\" class=\"btn\" id=\"bkFill\">Fill rows from list\u003c/button>\u003c/div>\n    \u003c/details>\n    \u003cp class=\"status\" id=\"bkStatus\" role=\"status\">\u003c/p>\n    \u003cdiv class=\"panel-foot\">\u003cspan class=\"grow\">\u003c/span>\u003cbutton type=\"button\" class=\"btn\" id=\"bkCancel\">Cancel\u003c/button>\u003cbutton type=\"submit\" class=\"btn primary\" id=\"bkSave\">Add words\u003c/button>\u003c/div>\n  \u003c/form>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"keys\" hidden>\n  \u003csection class=\"panel wide\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"kbTitle\">\n    \u003cdiv class=\"panel-head\">\u003ch2 id=\"kbTitle\">Keyboard shortcuts\u003c/h2>\u003cbutton type=\"button\" class=\"icon-btn\" id=\"kbClose\" aria-label=\"Close\">&times;\u003c/button>\u003c/div>\n    \u003cdiv class=\"kb-cols\">\n      \u003cdiv class=\"kb-group\">\n        \u003ch3>On the cards\u003c/h3>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>0\u003c/kbd> to \u003ckbd>9\u003c/kbd>\u003c/span>\u003cspan>Type a card number to hear that word and its antonyms. Type two digits for cards 10 and up.\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num Enter\u003c/kbd>\u003c/span>\u003cspan>Start presentation mode with your saved settings\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Esc\u003c/kbd>\u003c/span>\u003cspan>Stop reading\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num /\u003c/kbd> \u003ckbd>?\u003c/kbd>\u003c/span>\u003cspan>Show this list\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"kb-group\">\n        \u003ch3>In presentation mode\u003c/h3>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 6\u003c/kbd> \u003ckbd>&rarr;\u003c/kbd>\u003c/span>\u003cspan>Next word\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 4\u003c/kbd> \u003ckbd>&larr;\u003c/kbd>\u003c/span>\u003cspan>Previous word\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 5\u003c/kbd> \u003ckbd>Space\u003c/kbd>\u003c/span>\u003cspan>Pause or play\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 8\u003c/kbd> \u003ckbd>Num Enter\u003c/kbd>\u003c/span>\u003cspan>Hear this word again\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 7\u003c/kbd>\u003c/span>\u003cspan>Start again from the first word\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num +\u003c/kbd> \u003ckbd>Num &minus;\u003c/kbd>\u003c/span>\u003cspan>Longer or shorter time on each word\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num *\u003c/kbd>\u003c/span>\u003cspan>Slow voice on or off\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num .\u003c/kbd>\u003c/span>\u003cspan>Full screen\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 2\u003c/kbd>\u003c/span>\u003cspan>Presentation settings\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 0\u003c/kbd> \u003ckbd>Esc\u003c/kbd>\u003c/span>\u003cspan>Close presentation mode\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cp class=\"help\">Keep Num Lock on so the keypad sends numbers.\u003c/p>\n    \u003cdiv class=\"panel-foot\">\u003cspan class=\"grow\">\u003c/span>\u003cbutton type=\"button\" class=\"btn primary\" id=\"kbDone\">Done\u003c/button>\u003c/div>\n  \u003c/section>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"show\" hidden>\n  \u003csection class=\"panel\" id=\"ssSetup\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"ssTitle\">\n    \u003cdiv class=\"panel-head\">\u003ch2 id=\"ssTitle\">Presentation mode\u003c/h2>\u003cbutton type=\"button\" class=\"icon-btn\" id=\"ssClose\" aria-label=\"Close\">&times;\u003c/button>\u003c/div>\n    \u003cp class=\"help\" id=\"ssInfo\">\u003c/p>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"ssSec\">Time on each word\u003c/label>\n      \u003cdiv class=\"range\">\u003cinput type=\"range\" id=\"ssSec\" min=\"3\" max=\"40\" step=\"1\" value=\"8\">\u003coutput id=\"ssSecOut\" for=\"ssSec\">8 s\u003c/output>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"ssRounds\">Repeat the whole list\u003c/label>\n      \u003cdiv class=\"num-in\">\u003cinput type=\"number\" id=\"ssRounds\" min=\"1\" max=\"99\" value=\"2\" inputmode=\"numeric\">\u003cspan>times\u003c/span>\n        \u003clabel class=\"chk\" for=\"ssForever\">\u003cinput type=\"checkbox\" id=\"ssForever\">\u003cspan>Repeat until I stop\u003c/span>\u003c/label>\u003c/div>\n    \u003c/div>\n    \u003clabel class=\"chk\" for=\"ssSpeak\">\u003cinput type=\"checkbox\" id=\"ssSpeak\" checked>\u003cspan>Say each word and its antonyms aloud (the slide waits until it finishes)\u003c/span>\u003c/label>\n    \u003clabel class=\"chk\" for=\"ssShuffle\">\u003cinput type=\"checkbox\" id=\"ssShuffle\">\u003cspan>Shuffle the order in every round\u003c/span>\u003c/label>\n    \u003cdiv class=\"panel-foot\">\u003cspan class=\"grow\">\u003c/span>\u003cbutton type=\"button\" class=\"btn\" id=\"ssCancel\">Cancel\u003c/button>\u003cbutton type=\"button\" class=\"btn primary\" id=\"ssStart\">Start\u003c/button>\u003c/div>\n  \u003c/section>\n  \u003csection class=\"ss-stage\" id=\"ssStage\" hidden aria-label=\"Presentation\">\n    \u003cdiv class=\"ss-bar\">\u003cdiv id=\"ssBar\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"ss-top\">\n      \u003cspan id=\"ssMeta\">\u003c/span>\n      \u003cspan class=\"ss-top-actions\">\n        \u003cbutton type=\"button\" class=\"icon-btn\" id=\"ssKeys\" aria-label=\"Keyboard shortcuts\" title=\"Keyboard shortcuts\">&#9000;\u003c/button>\n        \u003cbutton type=\"button\" class=\"icon-btn\" id=\"ssFull\" aria-label=\"Full screen\" title=\"Full screen\">&#x26F6;\u003c/button>\n        \u003cbutton type=\"button\" class=\"icon-btn\" id=\"ssExit\" aria-label=\"Close presentation\" title=\"Close\">&times;\u003c/button>\n      \u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"ss-body\" id=\"ssBody\" aria-live=\"polite\">\u003c/div>\n    \u003cdiv class=\"ss-controls\">\n      \u003cbutton type=\"button\" class=\"ss-btn\" id=\"ssPrev\" aria-label=\"Previous word\" title=\"Previous word\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M15 5l-7 7 7 7\"/>\u003c/svg>\u003c/button>\n      \u003cbutton type=\"button\" class=\"ss-btn main\" id=\"ssPlay\" aria-label=\"Pause\" title=\"Pause\">\u003c/button>\n      \u003cbutton type=\"button\" class=\"ss-btn\" id=\"ssNext\" aria-label=\"Next word\" title=\"Next word\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 5l7 7-7 7\"/>\u003c/svg>\u003c/button>\n      \u003cbutton type=\"button\" class=\"ss-btn\" id=\"ssHear\" aria-label=\"Say this word again\" title=\"Say

003cbutton type=\"button\" class=\"rbtn\" id=\"voiceBtn\" data-tip=\"Choose voice\" aria-label=\"Choose voice\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/>\u003cpath d=\"M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6\"/>\u003c/svg>\u003c/button>\n      \u003cdiv class=\"flyout\" id=\"flyout\" hidden>\n        \u003clabel for=\"voice\">Voice\u003c/label>\n        \u003cselect id=\"voice\">\u003c/select>\n        \u003cbutton type=\"button\" class=\"btn\" id=\"vSample\">Hear sample\u003c/button>\n        \u003cp id=\"voiceStatus\">\u003c/p>\n        \u003cp>The voice you choose applies straight away. Hindi meanings use a Hindi voice if your device has one.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn\" id=\"slow\" data-tip=\"Slow voice: off\" aria-label=\"Slow voice\" aria-pressed=\"false\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M3 16a7.5 6.5 0 0 1 15 0z\"/>\u003ccircle cx=\"20.5\" cy=\"13\" r=\"1.8\"/>\u003cpath d=\"M6.5 16v3M14.5 16v3\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn\" id=\"keysBtn\" data-tip=\"Keyboard shortcuts\" aria-label=\"Keyboard shortcuts\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"6\" width=\"18\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M7 10h.01M11 10h.01M15 10h.01M7 14h10\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-sep\">\u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn danger\" id=\"clearAll\" data-tip=\"Clear all\" aria-label=\"Clear all\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6\"/>\u003c/svg>\u003c/button>\u003c/div>\n  \u003c/nav>\n  \u003cdiv class=\"stage\">\u003cdiv id=\"sheets\">\u003c/div>\u003c/div>\n\u003c/main>\n\n\u003cdiv class=\"overlay\" id=\"editor\" hidden>\n  \u003cform class=\"panel\" id=\"edForm\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"edTitle\" novalidate>\n    \u003cdiv class=\"panel-head\">\u003ch2 id=\"edTitle\">Add verb\u003c/h2>\u003cbutton type=\"button\" class=\"icon-btn\" id=\"edClose\" aria-label=\"Close\">&times;\u003c/button>\u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"ed_v1\">V1 &middot; base form\u003c/label>\n      \u003cdiv class=\"row\">\u003cinput type=\"text\" id=\"ed_v1\" maxlength=\"24\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"e.g. eat\">\u003cbutton type=\"button\" class=\"btn\" id=\"edHear\">Hear it\u003c/button>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"ed-grid\">\n      \u003cdiv class=\"field\">\u003clabel for=\"ed_v2\">V2 &middot; past\u003c/label>\u003cinput type=\"text\" id=\"ed_v2\" maxlength=\"24\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"e.g. ate\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"ed_v3\">V3 &middot; past participle\u003c/label>\u003cinput type=\"text\" id=\"ed_v3\" maxlength=\"24\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"e.g. eaten\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"ed_v4\">V4 &middot; -ing form \u003cspan class=\"opt\">auto if empty\u003c/span>\u003c/label>\u003cinput type=\"text\" id=\"ed_v4\" maxlength=\"24\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"e.g. eating\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"ed_v5\">V5 &middot; -s form \u003cspan class=\"opt\">auto if empty\u003c/span>\u003c/label>\u003cinput type=\"text\" id=\"ed_v5\" maxlength=\"24\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"e.g. eats\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"ed_hi\">Hindi meaning \u003cspan class=\"opt\">Hindi letters or English letters, e.g. khana\u003c/span>\u003c/label>\n      \u003cinput type=\"text\" id=\"ed_hi\" maxlength=\"40\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"e.g. खाना (khana)\">\n    \u003c/div>\n    \u003cp class=\"err\" id=\"edErr\" role=\"alert\" hidden>\u003c/p>\n    \u003cdiv class=\"panel-foot\">\n      \u003cbutton type=\"button\" class=\"btn danger\" id=\"edDelete\">Delete verb\u003c/button>\u003cspan class=\"grow\">\u003c/span>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"edCancel\">Cancel\u003c/button>\u003cbutton type=\"submit\" class=\"btn primary\">Save verb\u003c/button>\n    \u003c/div>\n  \u003c/form>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"bulk\" hidden>\n  \u003cform class=\"panel wide\" id=\"bkForm\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"bkTitle\" novalidate>\n    \u003cdiv class=\"panel-head\">\u003ch2 id=\"bkTitle\">Add many verbs\u003c/h2>\u003cbutton type=\"button\" class=\"icon-btn\" id=\"bkClose\" aria-label=\"Close\">&times;\u003c/button>\u003c/div>\n    \u003cp class=\"help\">Type each verb with its forms and Hindi meaning. Press Enter to move to the next box. If you leave V4 or V5 empty they are filled in for you (eat &rarr; eating, eats). Check irregular V2 and V3 yourself.\u003c/p>\n    \u003cdiv>\n      \u003cdiv class=\"bk-head\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003cspan>V1 base\u003c/span>\u003cspan>V2 past\u003c/span>\u003cspan>V3 participle\u003c/span>\u003cspan>V4 -ing\u003c/span>\u003cspan>V5 -s\u003c/span>\u003cspan>Hindi meaning\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n      \u003cdiv id=\"bkRows\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"bk-tools\">\u003cbutton type=\"button\" class=\"btn\" id=\"bkAddRow\">+ Add row\u003c/button>\u003cbutton type=\"button\" class=\"btn\" id=\"bkAdd5\">+ 5 rows\u003c/button>\u003c/div>\n    \u003cdetails class=\"paste\" id=\"bkPasteBox\">\n      \u003csummary>Paste a list from ChatGPT instead\u003c/summary>\n      \u003cp class=\"help\">Copy ChatGPT's list and paste it below. Lines like \u003cb>eat | ate | eaten | eating | eats | खाना (khana)\u003c/b> and tables both work.\u003c/p>\n      \u003cdiv class=\"row\">\u003cbutton type=\"button\" class=\"btn\" id=\"bkCopy\">Copy prompt for ChatGPT\u003c/button>\u003c/div>\n      \u003clabel class=\"chk\" for=\"bkAuto\">\u003cinput type=\"checkbox\" id=\"bkAuto\" checked>\u003cspan>Add the verbs as soon as I paste\u003c/span>\u003c/label>\n      \u003ctextarea id=\"bkPaste\" rows=\"5\" spellcheck=\"false\" placeholder=\"eat | ate | eaten | eating | eats | खाना (khana)&#10;go | went | gone | going | goes | जाना (jaana)\">\u003c/textarea>\n      \u003cdiv>\u003cbutton type=\"button\" class=\"btn\" id=\"bkFill\">Fill rows from list\u003c/button>\u003c/div>\n    \u003c/details>\n    \u003cp class=\"status\" id=\"bkStatus\" role=\"status\">\u003c/p>\n    \u003cdiv class=\"panel-foot\">\u003cspan class=\"grow\">\u003c/span>\u003cbutton type=\"button\" class=\"btn\" id=\"bkCancel\">Cancel\u003c/button>\u003cbutton type=\"submit\" class=\"btn primary\" id=\"bkSave\">Add verbs\u003c/button>\u003c/div>\n  \u003c/form>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"keys\" hidden>\n  \u003csection class=\"panel wide\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"kbTitle\">\n    \u003cdiv class=\"panel-head\">\u003ch2 id=\"kbTitle\">Keyboard shortcuts\u003c/h2>\u003cbutton type=\"button\" class=\"icon-btn\" id=\"kbClose\" aria-label=\"Close\">&times;\u003c/button>\u003c/div>\n    \u003cdiv class=\"kb-cols\">\n      \u003cdiv class=\"kb-group\">\n        \u003ch3>On the cards\u003c/h3>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>0\u003c/kbd> to \u003ckbd>9\u003c/kbd>\u003c/span>\u003cspan>Type a card number to hear that verb, its Hindi meaning and all its forms. Type two digits for cards 10 and up.\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num Enter\u003c/kbd>\u003c/span>\u003cspan>Start presentation mode with your saved settings\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Esc\u003c/kbd>\u003c/span>\u003cspan>Stop reading\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num /\u003c/kbd> \u003ckbd>?\u003c/kbd>\u003c/span>\u003cspan>Show this list\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"kb-group\">\n        \u003ch3>In presentation mode\u003c/h3>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 6\u003c/kbd> \u003ckbd>&rarr;\u003c/kbd>\u003c/span>\u003cspan>Next verb\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 4\u003c/kbd> \u003ckbd>&larr;\u003c/kbd>\u003c/span>\u003cspan>Previous verb\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 5\u003c/kbd> \u003ckbd>Space\u003c/kbd>\u003c/span>\u003cspan>Pause or play\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 8\u003c/kbd> \u003ckbd>Num Enter\u003c/kbd>\u003c/span>\u003cspan>Hear this verb again\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 7\u003c/kbd>\u003c/span>\u003cspan>Start again from the first verb\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num +\u003c/kbd> \u003ckbd>Num &minus;\u003c/kbd>\u003c/span>\u003cspan>Longer or shorter time on each verb\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num *\u003c/kbd>\u003c/span>\u003cspan>Slow voice on or off\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num .\u003c/kbd>\u003c/span>\u003cspan>Full screen\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 2\u003c/kbd>\u003c/span>\u003cspan>Presentation settings\u003c/span>\u003c/div>\n        \u003cdiv class=\"kb-row\">\u003cspan class=\"kb-keys\">\u003ckbd>Num 0\u003c/kbd> \u003ckbd>Esc\u003c/kbd>\u003c/span>\u003cspan>Close presentation mode\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cp class=\"help\">Keep Num Lock on so the keypad sends numbers.\u003c/p>\n    \u003cdiv class=\"panel-foot\">\u003cspan class=\"grow\">\u003c/span>\u003cbutton type=\"button\" class=\"btn primary\" id=\"kbDone\">Done\u003c/button>\u003c/div>\n  \u003c/section>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"show\" hidden>\n  \u003csection class=\"panel\" id=\"ssSetup\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"ssTitle\">\n    \u003cdiv class=\"panel-head\">\u003ch2 id=\"ssTitle\">Presentation mode\u003c/h2>\u003cbutton type=\"button\" class=\"icon-btn\" id=\"ssClose\" aria-label=\"Close\">&times;\u003c/button>\u003c/div>\n    \u003cp class=\"help\" id=\"ssInfo\">\u003c/p>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"ssSec\">Time on each verb\u003c/label>\n      \u003cdiv class=\"range\">\u003cinput type=\"range\" id=\"ssSec\" min=\"5\" max=\"60\" step=\"1\" value=\"15\">\u003coutput id=\"ssSecOut\" for=\"ssSec\">15 s\u003c/output>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"ssRounds\">Repeat the whole list\u003c/label>\n      \u003cdiv class=\"num-in\">\u003cinput type=\"number\" id=\"ssRounds\" min=\"1\" max=\"99\" value=\"2\" inputmode=\"numeric\">\u003cspan>times\u003c/span>\n        \u003clabel class=\"chk\" for=\"ssForever\">\u003cinput type=\"checkbox\" id=\"ssForever\">\u003cspan>Repeat until I stop\u003c/span>\u003c/label>\u003c/div>\n    \u003c/div>\n    \u003clabel class=\"chk\" for=\"ssSpeak\">\u003cinput type=\"checkbox\" id=\"ssSpeak\" checked>\u003cspan>Say each verb, its Hindi meaning and its forms aloud (the slide waits until it finishes)\u003c/span>\u003c/label>\n    \u003clabel class=\"chk\" for=\"ssShuffle\">\u003cinput type=\"checkbox\" id=\"ssShuffle\">\u003cspan>Shuffle the order in every round\u003c/span>\u003c/label>\n    \u003cdiv class=\"panel-foot\">\u003cspan class=\"grow\">\u003c/span>\u003cbutton type=\"button\" class=\"btn\" id=\"ssCancel\">Cancel\u003c/button>\u003cbutton type=\"button\" class=\"btn primary\" id=\"ssStart\">Start\u003c/button>\u003c/div>\n  \u003c/section>\n  \u003csection class=\"ss-stage\" id=\"ssStage\" hidden aria-label=\"Presentation\">\n    \u003cdiv class=\"ss-bar\">\u003cdiv id=\"ssBar\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"ss-top\">\n      \u003cspan id=\"ssMeta\">\u003c/span>\n      \u003cspan class=\"ss-top-actions\">\n        \u003cbutton type=\"button\" class=\"icon-btn\" id=\"ssKeys\" aria-label=\"Keyboard shortcuts\" title=\"Keyboard shortcuts\">&#9000;\u003c/button>\n        \u003cbutton type=\"button\" class=\"icon-btn\" id=\"ssFull\" aria-label=\"Full screen\" title=\"Full screen\">&#x26F6;\u003c/button>\n        \u003cbutton type=\"button\" class=\"icon-btn\" id=\"ssExit\" aria-label=\"Close presentation\" title=\"Close\">&times;\u003c/button>\n      \u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"ss-body\" id=\"ssBody\" aria-live=\"polite\">\u003c/div>\n    \u003cdiv class=\"ss-controls\">\n      \u003cbutton type=\"button\" class=\"ss-btn\" id=\"ssPrev\" aria-label=\"Previous verb\" title=\"Previous verb\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M15 5l-7 7 7 7\"/>\u003c/svg>\u003c/button>\n      \u003cbutton type=\"button\" class=\"ss-btn main\" id=\"ssPlay\" aria-label=\"Pause\" title=\"Pause\">\u003c/button>\n      \u003cbutton type=\"button\" class=\"ss-btn\" id=\"ssNext\" aria-label=\"Next verb\" title=\"Next verb\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 5l7 7-7 7\"/>\u003c/svg>\u003c/button>\n      \u003cbutton type=\"button\" class=\"ss-btn\" id=\"ssHear\" aria-label=\"Say this verb again\" title=\"Say this verb again\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" aria-hidden=\"true\">\u003cpath d=\"M4 9v6h4l5 4V5L8 9H4z\" fill=\"currentColor\"/>\u003cpath d=\"M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003c/svg>\u003c/button>\n      \u003cbutton type=\"button\" class=\"ss-btn\" id=\"ssGear\" aria-label=\"Presentation settings\" title=\"Presentation settings\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4 7h10M18 7h2M4 17h2M10 17h10\"/>\u003ccircle cx=\"16\" cy=\"7\" r=\"2\"/>\u003ccircle cx=\"8\" cy=\"17\" r=\"2\"/>\u003c/svg>\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\n\u003cstyle>:root{--h1:#7c3aed;--h2:#2563eb;--hi:\"\\1F3C3\"}.head{position:relative;overflow:hidden;align-items:center!important;gap:14px!important;padding:16px 18px!important; ,function(){gb.classList.remove(\"open\")});document.querySelectorAll(\".gotab\").forEach(function(b){b.addEventListener(\"click\",function(){if(!b.classList.contains(\"cur\")&&window.__go)window.__go(b.dataset.go);else gb.classList.remove(\"open\");});});\u003c/script>\n\u003cscript>\n(function () {\n  var KEY = 'verbs-sheet-v1', PER = 12;\n  var $ = function (s) { return document.querySelector(s); };\n  var ICON_SPEAK = '\u003csvg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" aria-hidden=\"true\">\u003cpath d=\"M4 9v6h4l5 4V5L8 9H4z\" fill=\"currentColor\"/>\u003cpath d=\"M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003c/svg>';\n  var ICON_EDIT = '\u003csvg viewBox=\"0 0 24 24\" width=\"15\" height=\"15\" aria-hidden=\"true\">\u003cpath d=\"M4 20h4L19 9l-4-4L4 16v4z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/>\u003c/svg>';\n  var ICON_PLAY = '\u003csvg viewBox=\"0 0 24 24\" width=\"28\" height=\"28\" fill=\"currentColor\" aria-hidden=\"true\">\u003cpath d=\"M8 5v14l11-7z\"/>\u003c/svg>';\n  var ICON_PAUSE = '\u003csvg viewBox=\"0 0 24 24\" width=\"28\" height=\"28\" fill=\"currentColor\" aria-hidden=\"true\">\u003cpath d=\"M7 5h4v14H7zM13 5h4v14h-4z\"/>\u003c/svg>';\n  var FORMS = [\n    { k: 'v1', tag: 'V1', name: 'Base', say: 'Base form' },\n    { k: 'v2', tag: 'V2', name: 'Past', say: 'Past' },\n    { k: 'v3', tag: 'V3', name: 'Past participle', say: 'Past participle' },\n    { k: 'v4', tag: 'V4', name: '-ing form', say: 'I N G form' },\n    { k: 'v5', tag: 'V5', name: '-s form', say: 'S form' }\n  ];\n  var EXAMPLES = [\n    ['eat', 'ate', 'eaten', 'eating', 'eats', 'खाना (khana)'],\n    ['go', 'went', 'gone', 'going', 'goes', 'जाना (jaana)'],\n    ['write', 'wrote', 'written', 'writing', 'writes', 'लिखना (likhna)'],\n    ['run', 'ran', 'run', 'running', 'runs', 'दौड़ना (daudna)'],\n    ['see', 'saw', 'seen', 'seeing', 'sees', n      var raw = localStorage.getItem(KEY);\n      if (raw) {\n        var s = JSON.parse(raw);\n        if (s && Array.isArray(s.words)) {\n          s.sheets = Math.max(1, Math.ceil(s.words.length / PER));\n          while (s.words.length \u003c s.sheets * PER) s.words.push(null);\n          if (typeof s.title !== 'string') s.title = 'Verb Forms';\n          if (typeof s.sub !== 'string') s.sub = '';\n          if (/past participle/.test(s.sub)) s.sub = 'V1 · V2 · V3 · V4 · V5 · Hindi meaning';\n          return s;\n        }\n      }\n    } catch (e) {}\n    return freshState();\n  }\n  var state = load();\n  function save() {\n    try { localStorage.setItem(KEY, JSON.stringify(state)); }\n    catch (e) { if (!warned) { warned = true; toast('This browser blocks saving, so changes will be lost when you close the page.'); } }\n  }\n  var toastTimer;\n  function toast(msg, label, fn) {\n    var t = $('#toast'); t.textContent = msg; t.classList.toggle('has-act', !!label);\n    if (label) {\n      var b = document.createElement('button'); b.type = 'button'; b.className = 'toast-act'; b.textContent = label;\n      b.addEventListener('click', function () { t.classList.remove('show', 'has-act'); fn(); });\n      t.appendChild(b);\n    }\n    t.classList.add('show'); clearTimeout(toastTimer);\n    toastTimer = setTimeout(function () { t.classList.remove('show', 'has-act'); }, label ? 8000 : 2400);\n  }\n\n  /* ---------- Sound ---------- */\n  var voices = [], run = 0;\n  function lang(v) { return String(v.lang || '').replace('_', '-'); }\n  function score(v) {\n    var l = lang(v), n = v.name || '', s;\n    if (l === 'en-IN') s = 100; else if (l.indexOf('hi') === 0) s = 60; else if (/^en-(GB|AU|ZA)/.test(l)) s = 20; else if (l.indexOf('en') === 0) s = 10; else return -1;\n    if (/natural|neural|online/i.test(n)) s += 40;\n    if (/neerja|prabhat|heera|ravi|veena|rishi|kalpana|hemant/i.test(n)) s += 30;\n    if (/google/i.test(n)) s += 15;\n    return s;\n  }\n  function goodVoices() { return voices.filter(function (v) { return score(v) >= 0; }).sort(function (a, b) { return score(b) - score(a); }); }\n  function pickVoice() {\n    var l = goodVoices();\n    if (state.voice) { var c = l.find(function (v) { return v.name === state.voice; }); if (c) return c; }\n    return l.find(function (v) { return lang(v).indexOf('en') === 0; }) || l[0] || null;\n  }\n  function hiVoice() {\n    var l = voices.filter(function (v) { return lang(v).indexOf('hi') === 0; });\n    l.sort(function (a, b) { return score(b) - score(a); });\n    return l[0] || null;\n  }\n  function populateVoices() {\n    var sel = $('#voice'), l = goodVoices();\n    sel.innerHTML = '\u003coption value=\"\">Best Indian voice (auto)\u003c/option>' + l.map(function (v) { return '\u003coption value=\"' + esc(v.name) + '\">' + esc(v.name) + ' (' + lang(v) + ')\u003c/option>'; }).join('');\n    sel.value = state.voice || ''; if (sel.value !== (state.voice || '')) sel.value = '';\n    var cur = pickVoice();\n    $('#voiceStatus').textContent = 'Voice in use: ' + (cur ? cur.name : 'browser default') + (hiVoice() ? '. Hindi voice found.' : '. No Hindi voice on this device.');\n  }\n  function loadVoices() { try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; } populateVoices(); }\n  if ('speechSynthesis' in window) { try { window.speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) {} }\n\n  function say(text, cb, hindi) {\n    var fin = false, t;\n    function done() { if (fin) return; fin = true; clearTimeout(t); if (cb) cb(); }\n    if (!('speechSynthesis' in window) || !text) { setTimeout(done, 60); return; }\n    var u = new SpeechSynthesisUtterance(text), v = hindi ? hiVoice() : pickVoice();\n    if (v) { u.voice = v; u.lang = lang(v); } else { u.lang = hindi ? 'hi-IN' : 'en-IN'; }\n    u.rate = state.slow ? 0.5 : 0.8; u.onend = done; u.onerror = done;\n    t = setTimeout(done, 2500 + text.length * 450);\n    try { window.speechSynthesis.speak(u); } catch (e) { done(); }\n  }\n  function sayHindi(h, cb) {\n    var m = String(h || '').match(/^(.*?)\\s*\\((.*)\\)\\s*$/), main = m ? m[1] : h, rom = m ? m[2] : '', dev = /[ऀ-ॿ]/.test(main);\n    if (!h) { cb(); return; }\n    if (dev && hiVoice()) say(main, cb, true);\n    else if (!dev) say(main, cb);\n    else if (rom) say(rom, cb);\n    else cb();\n  }\n  function clearMarks() {\n    document.querySelectorAll('.on').forEach(function (n) { n.classList.remove('on'); });\n    document.querySelectorAll('.card.now').forEach(function (n) { n.classList.remove('now'); });\n    document.querySelectorAll('.speak.playing, .ss-btn.playing').forEach(function (n) { n.classList.remove('playing'); });\n  }\n  function stopSpeech() { run++; try { window.speechSynthesis.cancel(); } catch (e) {} clearMarks(); }\n  /* Say the verb, its Hindi meaning, then every form; the one being read lights up */\n  function readWord(w, root, indicator, onEnd) {\n    stopSpeech();\n    var r = run, steps = [];\n    if (root && root.classList.contains('card')) root.classList.add('now');\n    if (indicator) indicator.classList.add('playing');\n    function mark(k) {\n      if (!root) return;\n      root.querySelectorAll('.on').forEach(function (n) { n.classList.remove('on'); });\n      if (k) { var n = root.querySelector('[data-f=\"' + k + '\"]'); if (n) n.classList.add('on'); }\n    }\n    steps.push(function (next) { mark('v1'); say(w.v1, next); });\n    FORMS.slice(1).forEach(function (f) {\n      if (w[f.k]) steps.push(function (next) { mark(f.k); say(w[f.k], next); });\n    });\n    if (w.hi) steps.push(function (next) { mark('hi'); say(w.v1 + ' means', function () { sayHindi(w.hi, next); }); });\n    var i = 0;\n    function go() {\n      if (r !== run) return;\n      if (i >= steps.length) { mark(null); clearMarks(); if (onEnd) onEnd(); return; }\n      steps[i++](function () { if (r !== run) return; setTimeout(go, 260); });\n    }\n    setTimeout(go, 100);\n  }\n\n  /* ---------- Sheets ---------- */\n  function formRows(w) {\n    return FORMS.slice(1).map(function (f) {\n      return '\u003cdiv class=\"frm\" data-f=\"' + f.k + '\">\u003cspan class=\"fl\">' + f.tag + '\u003c/span>\u003cb>' + esc(w[f.k] || '—') + '\u003c/b>\u003c/div>';\n    }).join('');\n  }\n  function cell(i) {\n    var w = state.words[i], n = i + 1;\n    if (!w) return '\u003cbutton type=\"button\" class=\"slot\" data-i=\"' + i + '\" aria-label=\"Add verb ' + n + '\">\u003cspan class=\"slot-num\">' + n + '\u003c/span>\u003cspan class=\"plus\" aria-hidden=\"true\">+\u003c/span>\u003cspan class=\"slot-text\">Add a verb\u003c/span>\u003c/button>';\n    return '\u003cdiv class=\"card\" data-i=\"' + i + '\">\u003cdiv class=\"c-head\">\u003cspan class=\"num\">' + n + '\u003c/span>\u003ch3 class=\"word\" data-f=\"v1\">' + esc(w.v1) + '\u003c/h3>\u003cspan class=\"vtag\">V1\u003c/span>' +\n      '\u003cbutton type=\"button\" class=\"speak\" data-speak=\"' + i + '\" aria-label=\"Hear ' + esc(w.v1) + ', its Hindi meaning and its forms\">' + ICON_SPEAK + '\u003c/button>' +\n      '\u003cbutton type=\"button\" class=\"edit\" data-edit=\"' + i + '\" aria-label=\"Edit ' + esc(w.v1) + '\">' + ICON_EDIT + '\u003c/button>\u003c/div>' +\n      (w.hi ? '\u003cp class=\"vhi\" data-f=\"hi\">' + esc(w.hi) + '\u003c/p>' : '') + '\u003cdiv class=\"forms\">' + formRows(w) + '\u003c/div>\u003c/div>';\n  }\n  function render() {\n    var html = '';\n    for (var s = 0; s \u003c state.sheets; s++) {\n      html += '\u003carticle class=\"sheet\" aria-label=\"Sheet ' + (s + 1) + '\">\u003cheader class=\"head\">\u003cdiv class=\"head-text\">' +\n        '\u003cinput class=\"title js-title\" value=\"' + esc(state.title) + '\" aria-label=\"Sheet title\" maxlength=\"40\">' +\n        '\u003cinput class=\"sub js-sub\" value=\"' + esc(state.sub) + '\" aria-label=\"Sheet subtitle\" maxlength=\"90\">\u003c/div>' +\n        '\u003cdiv class=\"head-meta\">Sheet ' + (s + 1) + ' of ' + state.s -width: calc(100% - 32px);\n}\n.toast.show { opacity: 1; transform: translate(-50%, 0); }\n.toast.has-act { pointer-events: auto; }\n.toast-act { margin-left: 12px; padding: 0; background: transparent; border: 0; color: inherit; font: inherit; font-weight: 600; text-decoration: underline; }\n@media (prefers-reduced-motion: reduce) { .toast, .rbtn::after { transition: none; } .speak.playing, .ss-btn.playing { animation: none; } }\n\n/* Narrow screens */\n@media (max-width: 999px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n@media (max-width: 699px) {\n  .wrap { gap: 10px; }\n  .rail { top: 10px; padding: 6px; gap: 4px; border-radius: 12px; }\n  .rbtn { width: 38px; height: 38px; }\n  .sheet { padding: 14px 14px 12px; }\n  .grid { grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto; }\n  .slot { min-height: 70px; }\n}\n\n/* Printing: one A4 sheet per page, 2 columns x 6 rows */\n@media print {\n  @page { size: A4; margin: 0; }\n  body { background: #fff !important; padding: 0 !important; }\n  .rail, .edit, .overlay, .toast { display: none !important; }\n  .wrap, .stage, #sheets { display: block; gap: 0; }\n  .sheet {\n    --sheet: #fff; --card: #f6f8fb; --ink: #14213d; --muted: #566277; --line: #c9d1de; --syn: #146c43; --syn-bg: #e2f4ea; --ant: #a8321f; --ant-bg: #fdebe7;\n    width: 210mm; height: 297mm; min-height: 0; padding: 10mm 11mm 7mm; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; overflow: hidden;\n  }\n  .sheet:last-child { break-after: auto; page-break-after: auto; }\n  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(6, minmax(0, 1fr)); grid-auto-rows: auto; gap: 3mm 4mm; }\n  .card { padding: 2.5mm 3mm; gap: 1.5mm; border-radius: 8px; overflow: hidden; }\n  .word { font-size: 17px; } .num { min-width: 18px; height: 18px; font-size: 9px; }\n  .speak { width: 26px; height: 26px; } .speak svg { width: 14px; height: 14px; }\n  .sec { padding: 1.5mm 2.5mm; } .sec h4 { font-size: 8px; margin-bottom: 2px; }\n  .chips { gap: 3px; } .chips span { font-size: 9.5px; padding: 0 6px; }\n  .slot .plus, .slot .slot-text { display: none; }\n}\n\u003c/style>\n\u003cstyle>\n/* Speech training page */\n.rd-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }\n.rd-bar .btn { padding: 11px 18px; font-size: 14px; }\n.rd-text { width: 100%; flex: 1; min-height: 52vh; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 18px 20px; font-size: 22px; line-height: 1.6; color: var(--ink); resize: vertical; font-family: var(--f-body); }\n.rd-view { flex: 1; min-height: 52vh; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 18px 22px; line-height: 1.75; color: var(--ink); overflow-wrap: anywhere; }\n.rd-view p { margin: 0 0 1em; }\n.sn { border-radius: 6px; cursor: pointer; padding: 1px 2px; transition: background .15s; }\n.sn:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }\n.sn.cur { background: color-mix(in srgb, var(--mark) 45%, transparent); }\n.sn.turn { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: 0 0 0 2px var(--accent); }\n.wd.on { background: var(--mark); color: var(--mark-ink); border-radius: 4px; box-shadow: 0 0 0 2px var(--mark); }\n.rd-status { margin: 0; min-height: 1.4em; font-size: 15px; color: var(--muted); text-align: center; }\n.rd-status.turn { color: var(--accent); font-weight: 600; font-size: 18px; }\n.rd-hint { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }\n.icbtn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: grid; place-items: center; }\n.icbtn:hover { border-color: var(--accent); color: var(--accent); }\n.icbtn.main { width: 60px; height: 60px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }\n.icbtn.main:hover { color: var(--accent-ink); filter: brightness(1.1); }\n.flyout .range { display: flex; align-items: center; gap: 10px; }\n.flyout .range input { flex: 1; accent-color: var(--accent); }\n.flyout .range output { min-width: 40px; text-align: right; font-size: 13px; }\n.flyout input[type=\"number\"] { width: 70px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 8px; font-size: 14px; }\n.flyout .fld { display: flex; flex-direction: column; gap: 6px; }\n.flyout .chk { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); }\n.spd { display: inline-flex; align-items: center; gap: 8px; margin-left: 14px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }\n.icbtn.sm { width: 38px; height: 38px; font-size: 22px; line-height: 1; }\n.spd-val { display: flex; flex-direction: column; align-items: center; min-width: 52px; line-height: 1.1; }\n.spd-val small { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }\n.spd-val b { font-size: 17px; font-variant-numeric: tabular-nums; }\n.rail-item.tall .flyout { top: auto; bottom: 0; }\n@media print { .rd-bar, .rd-text, .rail { display: none !important; } }\n\u003c/style>\n\n\u003cmain class=\"wrap\">\n  \u003cnav class=\"rail\" aria-label=\"Tools\">\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn\" id=\"pasteBtn\" data-tip=\"Paste text from clipboard\" aria-label=\"Paste text from clipboard\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"6\" y=\"5\" width=\"12\" height=\"16\" rx=\"2\"/>\u003cpath d=\"M9 5V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1\"/>\u003cpath d=\"M9.5 12h5M9.5 16h5\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn\" id=\"editBtn\" data-tip=\"Edit the text\" aria-label=\"Edit the text\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4 20h4L19 9l-4-4L4 16v4z\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cdiv class=\"rail-sep\">\u003c/div>\n    \u003cdiv class=\"rail-item\">\n      \u003cbutton type=\"button\" class=\"rbtn\" id=\"voiceBtn\" data-tip=\"Voice and speed\" aria-label=\"Voice and speed\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/>\u003cpath d=\"M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6\"/>\u003c/svg>\u003c/button>\n      \u003cdiv class=\"flyout\" id=\"voiceFly\" hidden>\n        \u003cdiv class=\"fld\">\u003clabel for=\"voice\">Voice\u003c/label>\u003cselect id=\"voice\">\u003c/select>\u003c/div>\n        \u003cdiv class=\"fld\">\u003clabel for=\"lang\">Language of the text\u003c/label>\u003cselect id=\"lang\">\u003coption value=\"auto\">Automatic (English, Hindi, Marathi)\u003c/option>\u003coption value=\"en\">English\u003c/option>\u003coption value=\"hi\">Hindi\u003c/option>\u003coption value=\"mr\">Marathi\u003c/option>\u003c/select>\u003c/div>\n        \u003cdiv class=\"fld\">\u003clabel for=\"rate\">Speed\u003c/label>\u003cdiv class=\"range\">\u003cinput type=\"range\" id=\"rate\" min=\"0.4\" max=\"1.3\" step=\"0.05\" value=\"0.8\">\u003coutput id=\"rateOut\" for=\"rate\">0.8x\u003c/output>\u003c/div>\u003c/div>\n        \u003cp id=\"vInfo\">\u003c/p>\n        \u003cp>Voices come from your browser, so they differ between devices. To add Hindi or Marathi: on Windows open Settings, Time and language, Language, add the language with its speech pack; on Android install Google Text-to-speech and download the Hindi or Marathi voice. Microsoft Edge also has natural Hindi and Marathi voices.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"rail-item\">\n      \u003cbutton type=\"button\" class=\"rbtn\" id=\"setBtn\" data-tip=\"Training settings\" aria-label=\"Training settings\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4 7h10M18 7h2M4 17h2M10 17h10\"/>\u003ccircle cx=\"16\" cy=\"7\" r=\"2\"/>\u003ccircle cx=\"8\" cy=\"17\" r=\"2\"/>\u003c/svg>\u003c/button>\n      \u003cdiv class=\"flyout\" id=\"setFly\" hidden>\n        \u003cdiv class=\"fld\">\u003clabel for=\"rep\">Say each sentence\u003c/label>\u003cdiv class=\"num-in\">\u003cinput type=\"number\" id=\"rep\" min=\"1\" max=\"5\" value=\"1\" inputmode=\"numeric\">\u003cspan>time(s)\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"fld\">\u003clabel for=\"pauseMode\">Pause for the class to repeat\u003c/label>\n          \u003cselect id=\"pauseMode\">\n            \u003coption value=\"0\">No pause\u003c/option>\n            \u003coption value=\"same\">Same time as the sentence\u003c/option>\n            \u003coption value=\"3\">3 seconds\u003c/option>\n            \u003coption value=\"5\">5 seconds\u003c/option>\n            \u003coption value=\"8\">8 seconds\u003c/option>\n            \u003coption value=\"12\">12 seconds\u003c/option>\n            \u003coption value=\"20\">20 seconds\u003c/option>\n          \u003c/select>\u003c/div>\n        \u003cdiv class=\"fld\">\u003clabel for=\"size\">Text size\u003c/label>\u003cdiv class=\"range\">\u003cinput type=\"range\" id=\"size\" min=\"16\" max=\"64\" step=\"2\" value=\"28\">\u003coutput id=\"sizeOut\" for=\"size\">28\u003c/output>\u003c/div>\u003c/div>\n        \u003clabel class=\"chk\" for=\"autoRead\">\u003cinput type=\"checkbox\" id=\"autoRead\" checked>\u003cspan>Start reading as soon as I paste\u003c/span>\u003c/label>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"rail-sep\">\u003c/div>\n    \u003cdiv class=\"rail-item\">\u003cbutton type=\"button\" class=\"rbtn danger\" id=\"clearBtn\" data-tip=\"Clear text\" aria-label=\"Clear text\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6\"/>\u003c/svg>\u003c/button>\u003c/div>\n  \u003c/nav>\n\n  \u003cdiv class=\"stage\">\n    \u003carticle class=\"sheet\">\n      \u003cheader class=\"head\">\n        \u003cdiv class=\"head-text\">\n          \u003ch1 class=\"title\" style=\"margin:0\">Speech Training\u003c/h1>\n          \u003cp class=\"sub\" style=\"margin:0\">Listen, repeat and speak with confidence\u003c/p>\n        \u003c/div>\n      \u003c/header>\n      \u003cdiv class=\"rd-bar\">\u003cbutton type=\"button\" class=\"btn primary\" id=\"readBtn\">&#9654; Read\u003c/button>\u003cspan class=\"grow\">\u003c/span>\u003c/div>\n      \u003ctextarea class=\"rd-text\" id=\"text\" aria-label=\"Text to read\" spellcheck=\"false\" placeholder=\"Paste or type the text here. Then press Read.\">\u003c/textarea>\n      \u003cdiv class=\"rd-view\" id=\"view\" hidden aria-live=\"off\">\u003c/div>\n      \u003cdiv class=\"rd-bar\" id=\"ctlBar\" style=\"justify-content:center\" hidden>\n        \u003cbutton type=\"button\" class=\"icbtn\" id=\"prevBtn\" aria-label=\"Previous sentence\" title=\"Previous sentence\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M15 5l-7 7 7 7\"/>\u003c/svg>\u003c/button>\n        \u003cbutton type=\"button\" class=\"icbtn main\" id=\"playBtn\" aria-label=\"Pause\" title=\" w.__go(b.dataset.go);else gb.classList.remove(\"open\");});});\u003c/script>\n\u003cscript>\n(function () {\n  var KEY = 'speechtraining-v1';\n  var $ = function (s) { return document.querySelector(s); };\n  var ICON_PLAY = '\u003csvg viewBox=\"0 0 24 24\" width=\"28\" height=\"28\" fill=\"currentColor\" aria-hidden=\"true\">\u003cpath d=\"M8 5v14l11-7z\"/>\u003c/svg>';\n  var ICON_PAUSE = '\u003csvg viewBox=\"0 0 24 24\" width=\"28\" height=\"28\" fill=\"currentColor\" aria-hidden=\"true\">\u003cpath d=\"M7 5h4v14H7zM13 5h4v14h-4z\"/>\u003c/svg>';\n  function esc(s) { return String(s).replace(/[&\u003c>\"']/g, function (c) { return { '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]; }); }\n  var S = { text: '', lang: 'auto', rate: 0.8, size: 28, rep: 1, pauseMode: 'same', auto: true, voice: '' };\n  try { var raw = localStorage.getItem(KEY); if (raw) Object.assign(S, JSON.parse(raw)); } catch (e) {}\n  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }\n  var toastTimer;\n  function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600); }\n\n  /* ---------- Voices ---------- */\n  var voices = [];\n  function lang(v) { return String(v.lang || '').replace('_', '-'); }\n  function score(v) {\n    var l = lang(v), n = v.name || '', s;\n    if (l === 'en-IN') s = 100; else if (l.indexOf('hi') === 0 || l.indexOf('mr') === 0) s = 60; else if (/^en-(GB|AU|ZA)/.test(l)) s = 20; else if (l.indexOf('en') === 0) s = 10; else return -1;\n    if (/natural|neural|online/i.test(n)) s += 40;\n    if (/neerja|prabhat|heera|ravi|veena|rishi|kalpana|hemant/i.test(n)) s += 30;\n    if (/google/i.test(n)) s += 15;\n    return s;\n  }\n  function goodVoices() { return voices.filter(function (v) { return score(v) >= 0; }).sort(function (a, b) { return score(b) - score(a); }); }\n  function pickVoice() {\n    var l = goodVoices();\n    if (S.voice) { var c = l.find(function (v) { return v.name === S.voice; }); if (c) return c; }\n    return l.find(function (v) { return lang(v).indexOf('en') === 0; }) || l[0] || null;\n  }\n  function byLang(code) { return voices.filter(function (v) { return lang(v).indexOf(code) === 0; }).sort(function (a, b) { return score(b) - score(a); })[0] || null; }\n  var MARATHI = /ळ|आहे|आणि|नाही|माझ|तुम्ही|होती|होता|त्या|मला|जायचे/;\n  function isDev(t) {\n    var d = (t.match(/[ऀ-ॿ]/g) || []).length, l = (t.match(/[A-Za-z]/g) || []).length;\n    return d > 0 && d >= l;\n  }\n  /* Which voice should say this sentence? */\n  function chooseVoice(text) {\n    var mode = S.lang, dev = mode === 'hi' || mode === 'mr' || (mode === 'auto' && isDev(text));\n    if (!dev) return { v: pickVoice(), code: 'en-IN', missing: false };\n    var wantMr = mode === 'mr' || (mode === 'auto' && MARATHI.test(text));\n    var v = wantMr ? (byLang('mr') || byLang('hi')) : (byLang('hi') || byLang('mr'));\n    return { v: v, code: wantMr ? 'mr-IN' : 'hi-IN', missing: !v };\n  }\n  function populate() {\n    var sel = $('#voice'), l = goodVoices();\n    sel.innerHTML = '\u003coption value=\"\">Best Indian voice (auto)\u003c/option>' + l.map(function (v) { return '\u003coption value=\"' + esc(v.name) + '\">' + esc(v.name) + ' (' + lang(v) + ')\u003c/option>'; }).join('');\n    sel.value = S.voice || ''; if (sel.value !== (S.voice || '')) sel.value = '';\n    var h = byLang('hi'), m = byLang('mr'), e = pickVoice();\n    $('#vInfo').textContent = 'English: ' + (e ? e.name : 'browser default') + '. Hindi: ' + (h ? h.name : 'not found') + '. Marathi: ' + (m ? m.name : (h ? 'not found, the Hindi voice is used' : 'not found')) + '.';\n  }\n  function loadVoices() { try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; } populate(); }\n  if ('speechSynthesis' in window) { try { window.speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) {} loadVoices(); }\n\n  /* ---------- Text into sentences ---------- */\n  var sents = [];\n  function splitText(t) {\n    var out = [];\n    String(t || '').replace(/\\r/g, '').split(/\\n+/).forEach(function (para, pi) {\n      para = para.trim(); if (!para) return;\n      var parts = para.match(/[^.!?।]+(?:[.!?।]+[\"')\\]”]*|$)/g) || [para];\n      parts.forEach(function (p) { p = p.trim(); if (p && /[^\\s.!?।]/.test(p)) out.push({ t: p, p: pi }); });\n    });\n    return out;\n  }\n  function renderView() {\n    var html = '', lastP = -1;\n    sents.forEach(function (s, i) {\n      if (s.p !== lastP) { if (lastP !== -1) html += '\u003c/p>'; html += '\u003cp>'; lastP = s.p; }\n      var pos = 0, words = '';\n      s.t.split(/(\\s+)/).forEach(function (w) {\n        if (/^\\s+$/.test(w) || !w) { words += w; pos += w.length; return; }\n        words += '\u003cspan class=\"wd\" data-s=\"' + pos + '\" data-e=\"' + (pos + w.length) + '\">' + esc(w) + '\u003c/span>'; pos += w.length;\n      });\n      html += '\u003cspan class=\"sn\" data-i=\"' + i + '\">' + words + '\u003c/span> ';\n    });\n    if (lastP !== -1) html += '\u003c/p>';\n    $('#view').innerHTML = html;\n  }\n\n  /* ---------- Reading ----------\n     State: cur = sentence being (or about to be) read, rep = which repeat of it.\n     Pause and play keep both, so resuming continues from the same place. */\n  var cur = 0, rep = 1, shown = 0, token = 0, playing = false, timer = null, countTimer = null;\n  function setStatus(m, turn) { var s = $('#status'); s.textContent = m || ''; s.classList.toggle('turn', !!turn); }\n  function setPlayIcon() { var b = $('#playBtn'); b.innerHTML = playing ? ICON_PAUSE : ICON_PLAY; b.setAttribute('aria-label', playing ? 'Pause' : 'Play'); b.title = playing ? 'Pause' : 'Play'; }\n  function clearMarks() {\n    document.querySelectorAll('.sn.cur, .sn.turn').forEach(function (n) { n.classList.remove('cur', 'turn'); });\n    document.querySelectorAll('.wd.on').forEach(function (n) { n.classList.remove('on'); });\n  }\n  function mark(i, turn) {\n    clearMarks();\n    var el = $('.sn[data-i=\"' + i + '\"]'); if (!el) return;\n    el.classList.add(turn ? 'turn' : 'cur');\n    try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }\n  }\n  var curAudio = null;\n  function haltSpeech() { token++; clearTimeout(timer); clearInterval(countTimer); try { window.speechSynthesis.cancel(); } catch (e) {} if (curAudio) { try { curAudio.pause(); } catch (e) {} curAudio = null; } }\n  /* Online fallback for a language with no voice on this device: short pieces played as audio */\n  function pieces(text) {\n    var out = [], c = '';\n    text.split(/(\\s+)/).forEach(function (w) { if ((c + w).length > 170 && c.trim()) { out.push(c.trim()); c = w; } else c += w; });\n    if (c.trim()) out.push(c.trim());\n    return out;\n  }\n  function playOnline(text, code, rate, onEnd) {\n    var list = pieces(text), k = 0, ended = false, tl = code.slice(0, 2);\n    function end() { if (ended) return; ended = true; onEnd(); }\n    function next() {\n      if (ended) return;\n      if (k >= list.length) { end(); return; }\n      var a = new Audio('https://translate.googleapis.com/translate_tts?ie=UTF-8&client=tw-ob&tl=' + tl + '&q=' + encodeURIComponent(list[k++]));\n      a.playbackRate = Math.max(0.5, Math.min(1.3, rate / 0.9));\n      curAudio = a;\n      a.onended = next;\n      a.onerror = function () { setStatus('Could not play the online ' + (tl === 'mr' ? 'Marathi' : 'Hindi') + ' voice. Add a ' + (tl === 'mr' ? 'Marathi' : 'Hindi') + ' voice to this device: open Voice and speed to see how.'); end(); };\n      var pr = a.play(); if (pr && pr.catch) pr.catch(function () { a.onerror(); });\n    }\n    next();\n  }\n  function stopAll() { haltSpeech(); playing = false; cur = 0; rep = 1; clearMarks(); setPlayIcon(); setStatus('Stopped.'); }\n  function finish() { haltSpeech(); playing = false; cur = 0; rep = 1; clearMarks(); setPlayIcon(); setStatus('Finished. Tap a sentence or press play to read again.'); }\n  function utter(text, rate, onEnd, onWord) {\n    var fin = false, tt;\n    function done() { if (fin) return; fin = true; clearTimeout(tt); onEnd(); }\n    if (!('speechSynthesis' in window)) { setStatus('This browser cannot read aloud. Try Chrome, Edge or Safari.'); setTimeout(done, 400); return; }\n    var u = new SpeechSynthesisUtterance(text), ch = chooseVoice(text), v = ch.v;\n    if (ch.missing) { playOnline(text, ch.code, rate, done); return; }\n    if (v) { u.voice = v; u.lang = lang(v); } else { u.lang = ch.code; }\n    u.rate = rate; u.onend = done; u.onerror = done;\n    if (onWord) u.onboundary = function (e) { if (e.name === 'word' || e.name === undefined) onWord(e.charIndex || 0); };\n    tt = setTimeout(done, (3000 + text.length * 450) / Math.max(rate, 0.4));\n    try { window.speechSynthesis.speak(u); } catch (e) { done(); }\n  }\n  /* The gap that lets the class repeat the sentence */\n  function gapMs(spoken) {\n    if (S.pauseMode === '0') return 350;\n    if (S.pauseMode === 'same') return Math.min(25000, Math.max(2000, spoken * 1.2));\n    return Math.max(1, +S.pauseMode || 3) * 1000;\n  }\n  function speakCurrent() {\n    if (cur >= sents.length) { finish(); return; }\n    var my = ++token, s = sents[cur], i = cur, t0 = Date.now();\n    shown = i; mark(i, false);\n    var vc = chooseVoice(s.t);\n    setStatus('Sentence ' + (i + 1) + ' of ' + sents.length + (S.rep > 1 ? '  ·  time ' + rep + ' of ' + S.rep : '') + '  ·  voice: ' + (vc.v ? vc.v.name : (vc.code === 'en-IN' ? 'browser default' : 'online ' + vc.code.slice(0, 2).toUpperCase())));\n    var spans = $('.sn[data-i=\"' + i + '\"]').querySelectorAll('.wd');\n    function onWord(ci) {\n      if (my !== token) return;\n      document.querySelectorAll('.wd.on').forEach(function (n) { n.classList.remove('on'); });\n      for (var k = 0; k \u003c spans.length; k++) { if (ci >= +spans[k] rill: false, think: 4, hide: false, slow: false, voice: '', show: null };\n  try { var raw = localStorage.getItem(KEY); if (raw) Object.assign(S, JSON.parse(raw)); } catch (e) {}\n  var warned = false;\n  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { if (!warned) { warned = true; toast('This browser blocks saving, so settings are lost when you close the page.'); } } }\n  var toastTimer;\n  function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400); }\n\n  /* ---------- Words for numbers ---------- */\n  var ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];\n  var TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];\n  function words(n) {\n    if (n \u003c 20) return ONES[n];\n    if (n \u003c 100) return TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + ONES[n % 10] : '');\n    return ONES[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' ' + words(n % 100) : '');\n  }\n  function plural(w) { return /y$/.test(w) ? w.slice(0, -1) + 'ies' : /(x|s|ch|sh)$/.test(w) ? w + 'es' : w + 's'; }\n  function lineText(t, m) {\n    var p = t * m;\n    if (S.style === 'zaa') return t + ', ' + words(m) + ' zaa, ' + p;\n    return S.style === 'ones' ? words(t) + ' ' + plural(words(m)) + ' are ' + words(p) : t + ' times ' + m + ' is ' + p;\n  }\n  function questionText(t, m) { if (S.style === 'zaa') return t + ', ' + words(m) + ' zaa'; return S.style === 'ones' ? words(t) + ' ' + plural(words(m)) : t + ' times ' + m; }\n  function answerText(t, m) { if (S.style === 'zaa') return '' + (t * m); return S.style === 'ones' ? 'are ' + words(t * m) : 'is ' + (t * m); }\n\n  /* ---------- Sound ---------- */\n  var voices = [], run = 0;\n  function lang(v) { return String(v.lang || '').replace('_', '-'); }\n  function score(v) {\n    var l = lang(v), n = v.name || '', s;\n    if (l === 'en-IN') s = 100; else if (/^en-(GB|AU|ZA)/.test(l)) s = 20; else if (l.indexOf('en') === 0) s = 10; else return -1;\n    if (/natural|neural|online/i.test(n)) s += 40;\n    if (/neerja|prabhat|heera|ravi|veena|rishi|kalpana|hemant/i.test(n)) s += 30;\n    if (/google/i.test(n)) s += 15;\n    return s;\n  }\n  function goodVoices() { return voices.filter(function (v) { return score(v) >= 0; }).sort(function (a, b) { return score(b) - score(a); }); }\n  function pickVoice() {\n    var l = goodVoices();\n    if (S.voice) { var c = l.find(function (v) { return v.name === S.voice; }); if (c) return c; }\n    return l[0] || null;\n  }\n  function populateVoices() {\n    var sel = $('#voice'), l = goodVoices();\n    sel.innerHTML = '\u003coption value=\"\">Best Indian voice (auto)\u003c/option>' + l.map(function (v) { return '\u003coption value=\"' + esc(v.name) + '\">' + esc(v.name) + ' (' + lang(v) + ')\u003c/option>'; }).join('');\n    sel.value = S.voice || ''; if (sel.value !== (S.voice || '')) sel.value = '';\n    var cur = pickVoice(); $('#voiceStatus').textContent = 'Voice in use: ' + (cur ? cur.name : 'browser default');\n  }\n  function loadVoices() { try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; } populateVoices(); }\n  if ('speechSynthesis' in window) { try { window.speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) {} }\n  function say(text, cb) {\n    var fin = false, t;\n    function done() { if (fin) return; fin = true; clearTimeout(t); if (cb) cb(); }\n    if (!('speechSynthesis' in window)) { setTimeout(done, 60); return; }\n    var u = new SpeechSynthesisUtterance(text), v = pickVoice();\n    if (v) { u.voice = v; u.lang = lang(v); } else { u.lang = 'en-IN'; }\n    u.rate = S.slow ? 0.55 : 0.85; u.onend = done; u.onerror = done;\n    t = setTimeout(done, 2500 + text.length * 450);\n    try { window.speechSynthesis.speak(u); } catch (e) { done(); }\n  }\n  function clearMarks() {\n    document.querySelectorAll('.trow.on, .ss-line.on').forEach(function (n) { n.classList.remove('on'); });\n    document.querySelectorAll('.card.now').forEach(function (n) { n.classList.remove('now'); });\n    document.querySelectorAll('.speak.playing, .ss-btn.playing').forEach(function (n) { n.classList.remove('playing'); });\n    document.querySelectorAll('.ss-line.pend').forEach(function (n) { n.classList.remove('pend'); });\n  }\n  var thinkTimer = null;\n  function stopSpeech() { run++; clearTimeout(thinkTimer); try { window.speechSynthesis.cancel(); } catch (e) {} clearMarks(); }\n  /* Read a whole table, one line at a time, lighting up the line being said */\n  function readTable(t, root, indicator, onEnd, noSpeak) {\n    stopSpeech();\n    var r = run, m = 1, N = +S.rows, pass = 1, REP = Math.max(1, +S.rep || 1);\n    if (root && root.classList.contains('card')) root.classList.add('now');\n    if (indicator) indicator.classList.add('playing');\n    function line(k) { return root ? root.querySelector('[data-m=\"' + k + '\"]') : null; }\n    function next() {\n      if (r !== run) return;\n      if (m > N && pass \u003c REP) { pass++; m = 1; thinkTimer = setTimeout(next, 700); return; }\n      if (m > N) { clearMarks(); if (onEnd) onEnd(); return; }\n      var k = m++, el = line(k);\n      document.querySelectorAll('.trow.on, .ss-line.on').forEach(function (n) { n.classList.remove('on'); });\n      if (el) { el.classList.add('on'); el.classList.remove('pend'); }\n      if (noSpeak) { thinkTimer = setTimeout(next, 1200); return; }\n      if (S.drill) {\n        if (el) el.classList.add('pend');\n        say(questionText(t, k), function () {\n          if (r !== run) return;\n          thinkTimer = setTimeout(function () {\n            if (r !== run) return;\n            if (el) el.classList.remove('pend');\n            say(answerText(t, k), function () { if (r !== run) return; thinkTimer = setTimeout(next, 500); });\n          }, S.think * 1000);\n        });\n      } else say(lineText(t, k), function () { if (r !== run) return; thinkTimer = setTimeout(next, 350); });\n    }\n    setTimeout(next, 120);\n  }\n\n  /* ---------- Sheets ---------- */\n  function tableList() { var o = [], a = Math.max(1, Math.min(30, +S.from || 1)), b = Math.max(a, Math.min(30, +S.to || 30)); for (var t = a; t \u003c= b; t++) o.push(t); return o; }\n  function card(t, n) {\n    var rows = '';\n    for (var m = 1; m \u003c= +S.rows; m++) rows += '\u003cbutton type=\"button\" class=\"trow\" data-t=\"' + t + '\" data-m=\"' + m + '\">\u003cspan class=\"a\">' + t + '\u003c/span>\u003cspan class=\"x\">×\u003c/span>\u003cspan class=\"m\">' + m + '\u003c/span>\u003cspan class=\"eq\">=\u003c/span>\u003cb>' + (t * m) + '\u003c/b>\u003c/button>';\n    return '\u003cdiv class=\"card\" data-t=\"' + t + '\">\u003cdiv class=\"c-head\">\u003cspan class=\"num\">' + n + '\u003c/span>\u003ch3 class=\"word\">Table of ' + t + '\u003c/h3>' +\n      '\u003cbutton type=\"button\" class=\"speak\" data-speak=\"' + t + '\" aria-label=\"Hear the table of ' + t + '\">' + ICON_SPEAK + '\u003c/button>\u003c/div>\u003cdiv class=\"rows\">' + rows + '\u003c/div>\u003c/div>';\n  }\n  function render() {\n    var list = tableList(), html = '', sheets = Math.max(1, Math.ceil(list.length / PER));\n    for (var s = 0; s \u003c sheets; s++) {\n      html += '\u003carticle class=\"sheet' + (S.hide ? ' hide-ans' : '') + '\" data-rows=\"' + S.rows + '\" aria-label=\"Sheet ' + (s + 1) + '\">\u003cheader class=\"head\">\u003cdiv class=\"head-text\">' +\n        '\u003cinput class=\"title js-title\" value=\"' + esc(S.title) + '\" aria-label=\"Sheet title\" maxlength=\"40\">' +\n        '\u003cinput class=\"sub js-sub\" value=\"' + esc(S.sub) + '\" aria-label=\"Sheet subtitle\" maxlength=\"80\">\u003c/div>' +\n        '\u003cdiv class=\"head-meta\">Sheet ' + (s + 1) + ' of ' + sheets + '\u003c/div>\u003c/header>\u003col class=\"grid\">';\n      list.slice(s * PER, (s + 1) * PER).forEach(function (t, k) { html += '\u003cli>' + card(t, s * PER + k + 1) + '\u003c/li>'; });\n      html += '\u003c/ol>\u003cfooter class=\"foot\">\u003cspan>Read it aloud &middot; Say it again &middot; Cover the answers and test yourself\u003c/span>\u003cspan>' + esc(S.title) + ' &middot; ' + (s + 1) + '\u003c/span>\u003c/footer>\u003c/article>';\n    }\n    $('#sheets').innerHTML = html; setSlowUI(); setHideUI();\n  }\n  $('#sheets').addEventListener('click', function (e) {\n    var sp = e.target.closest('[data-speak]');\n    if (sp) { cardPlay(+sp.dataset.speak); return; }\n    var row = e.target.closest('.trow');\n    if (row) {\n      row.classList.add('rev');\n      var t = +row.dataset.t, m = +row.dataset.m;\n      stopSpeech(); row.classList.add('rev'); row.classList.add('on'); say(lineText(t, m), function () { row.classList.remove('on'); });\n    }\n  });\n  $('#sheets').addEventListener('input', function (e) {\n    var t = e.target, key = t.classList.contains('js-title') ? 'title' : t.classList.contains('js-sub') ? 'sub' : '';\n    if (!key) return; S[key] = t.value;\n    document.querySelectorAll(key === 'title' ? '.js-title' : '.js-sub').forEach(function (o) { if (o !== t) o.value = t.value; }); save();\n  });\n  function cardPlay(t) {\n    var el = document.querySelector('.card[data-t=\"' + t + '\"]'); if (!el) return;\n    document.querySelectorAll('.trow.rev').forEach(function (n) { n.classList.remove('rev'); });\n    readTable(t, el, el.querySelector('.speak'));\n    try { el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }\n  }\n\n  /* ---------- Left column ---------- */\n  function setSlowUI() { var b = $('#slow'); b.setAttribute('aria-pressed', S.slow ? 'true' : 'false'); b.dataset.tip = S.slow ? 'Slow voice: on' : 'Slow voice: off'; }\n  function setHideUI() { var b = $('#hideBtn'); b.setAttribute('aria-pressed', S.hide ? 'true' : 'false'); b.dataset.tip = S.hide ? 'Hide answers (practice): on' : 'Hide answers (practice): off'; }\n  $('#slow').addEventListener('click', function () { S.slow = !S.slow; save(); setSlowUI(); toast(S.slow ? 'Slow voice on' : 'Slow voice off'); });\n  $('#hideBtn').addEventListener('click', function () {\n    S.hide = !S.hide; save(); setHideUI();\n    document.querySelectorAll('.sheet').forEach(function (s) { s.classList.toggle('hide-ans', S.hide); });\n    document.querySelectorAll('.trow.rev').forEach(function (n) { n.classList.remove('rev'); });\n    toast(S.hide ? 'Answers hidden. Tap a line to see its answer.' : 'Answers shown');\n  });\n  var flys = [['#voiceBtn', '#flyout'], ['#setBtn', '#setFly']];\n  function closeFlys(except) { flys.forEach(function (p) { if (p[1] !== except) { $(p[1]).hidden = true; $(p[0]).setAttribute('aria-expanded', 'false'); } }); }\n  function anyFly() { return flys.some(function (p) { return !$(p[1]).hidden; }); }\n  flys.forEach(function (p) {\n    $(p[0]).addEventListener('click', function (e) { e.stopPropagation(); var f = $(p[1]); closeFlys(p[1]); f.hidden = !f.hidden; $(p[0]).setAttribute('aria-expanded', f.hidden ? 'false' : 'true'); });\n    $(p[1]).addEventListener('click', function (e) { e.stopPropagation(); });\n  });\n  document.addEventListener('click', function () { closeFlys(''); });\n  $('#voice').addEventListener('change', function (e) { S.voice = e.target.value; save(); populateVoices(); stopSpeech(); say('Multiplication tables'); });\n  $('#vSample').addEventListener('click', function () { stopSpeech(); say(lineText(7, 3)); });\n  $('#from').value = S.from; $('#to').value = S.to; $('#rows').value = String(S.rows); $('#style').value = S.style; $('#drill').checked = !!S.drill; $('#rep').value = S.rep || 1; $('#think').value = S.think; $('#thinkOut').textContent = S.think + ' s';\n  function readRange() {\n    var a = Math.max(1, Math.min(30, parseInt($('#from').value, 10) || 1)), b = Math.max(1, Math.min(30, parseInt($('#to').value, 10) || 30));\n    if (b \u003c a) b = a; S.from = a; S.to = b; $('#from').value = a; $('#to').value = b; save(); stopSpeech(); render();\n  }\n  $('#from').addEventListener('change', readRange); $('#to').addEventListener('change', readRange);\n  $('#rows').addEventListener('change', function (e) { S.rows = +e.target.value; save(); stopSpeech(); render(); });\n  $('#style').addEventListener('change', function (e) { S.style = e.target.value; save(); });\n  $('#rep').addEventListener('change', function (e) { S.rep = Math.max(1, Math.min(20, parseInt(e.target.value, 10) || 1)); e.target.value = S.rep; save(); });\n  $('#drill').addEventListener('change', function (e) { S.drill = e.target.checked; save(); });\n  $('#think').addEventListener('input', function (e) { S.think = +e.target.value; $('#thinkOut').textContent = S.think + ' s'; save(); });\n\n  /* ---------- Presentation mode ---------- */\n  var SS_DEFAULT = { rounds: 1, forever: false, speak: true, shuffle: false };\n  var ssEl = $('#show'), ssOrder = [], ssPos = 0, ssRound = 1, ssPlaying = true, ssDone = false, ssCfg = null, ssTimer = null;\n  function ssBuild() {\n    var o = tableList();\n    if (ssCfg.shuffle) for (var i = o.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = o[i]; o[i] = o[j]; o[j] = t; }\n    return o;\n  }\n  function ssSetPlayIcon() { var b = $('#ssPlay'); b.innerHTML = ssPlaying ? ICON_PAUSE : ICON_PLAY; b.setAttribute('aria-label', ssPlaying ? 'Pause' : 'Play'); b.title = ssPlaying ? 'Pause' : 'Play'; }\n  function ssOpen() {\n    var c = Object.assign({}, SS_DEFAULT, S.show || {}), n = tableList().length;\n    $('#ssRounds').value = c.rounds; $('#ssForever').checked = !!c.forever; $('#ssRounds').disabled = !!c.forever; $('#ssSpeak').checked = !!c.speak; $('#ssShuffle').checked = !!c.shuffle;\n    $('#ssInfo').textContent = n + (n === 1 ? ' table plays' : ' tables play') + ' one after another, ea

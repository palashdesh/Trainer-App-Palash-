 the opposite meaning\":\"Say the exact opposite\",\"V1 · V2 · V3 · V4 · V5 · Hindi meaning\":\"Action words in all their forms\",\"Tables 1 to 30 · listen, repeat and remember\":\"Tables 1 to 30: listen, repeat, remember\",\"3 times \\\\u00d7 4 types. Tap any box to learn it.\":\"Time + type = tense. Learn all 12 the easy way\"};function place(){document.querySelectorAll(\".head input\").forEach(function(i){i.readOnly=true;i.tabIndex=-1;i.setAttribute(\"aria-readonly\",\"true\")});document.querySelectorAll(\".head input.sub\").forEach(function(i){var n=OS[i.value];if(n){i.value=n;i.dispatchEvent(new Event(\"input\",{bubbles:true}))}});var sh=document.querySelector(\".sheet\"),hd=sh&&sh.querySelector(\".head\");if(sh&&hd){if(gb.parentNode!==sh)sh.insertBefore(gb,hd);if(gm.parentNode!==hd)hd.appendChild(gm);}else if(!gb.parentNode||gb.parentNode===document.body){document.body.insertBefore(gb,document.body.firstChild);}}place();var pt=0;new MutationObserver(function(){cancelAnimationFrame(pt);pt=requestAnimationFrame(place)}).observe(document.body,{childList:true,subtree:true});gm.addEventListener(\"click\",function(e){e.stopPropagation();var o=gb.classList.toggle(\"open\");gm.setAttribute(\"aria-expanded\",o)});document.addEventListener(\"click\",function(){gb.classList.remove(\"open\")});document.querySelectorAll(\".gotab\").forEach(function(b){b.addEventListener(\"click\",function(){if(!b.classList.contains(\"cur\")&&window.__go)window.__go(b.dataset.go);else gb.classList.remove(\"open\");});});\u003c/script>\n\u003cscript>\n(function () {\n  var KEY = 'tenses-sheet-v1', $ = function (s) { return document.querySelector(s); };\n  function esc(s) { return String(s).replace(/[&\u003c>\"']/g, function (c) { return { '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]; }); }\n  var S = { slow: false };\n  try { var raw = localStorage.getItem(KEY); if (raw) Object.assign(S, JSON.parse(raw)); } catch (e) {}\n  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }\n  var tt; function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('show'); }, 2200); }\n\n  var TIMES = ['Past', 'Present', 'Future'], COLS = { Past: 0, Present: 1, Future: 2 };\n  var TYPES = [\n    { k: 'Simple', hi: 'Simple (basic)', rule: 'Just the verb', col: 'var(--c0)', mem: 'SIMPLE = simple verb. Nothing extra.' },\n    { k: 'Continuous', hi: 'Continuous (going on)', rule: 'be + verb-ING', col: 'var(--c1)', mem: 'CONTINUOUS = ING. The work is still going on.' },\n    { k: 'Perfect', hi: 'Perfect (finished)', rule: 'have/had + V3', col: 'var(--c2)', mem: 'PERFECT = V3. The work is done.' },\n    { k: 'Perfect Continuous', hi: 'Perfect Continuous (going on for some time)', rule: 'have been + verb-ING', col: 'var(--c3)', mem: 'PERFECT CONTINUOUS = BEEN + ING. Going on for some time.' }\n  ];\n  /* time, type, hindi, positive, negative, question, use, signals, example1, example2, trick */\n  var D = [\n    ['Present', 0, '\\u0938\\u093e\\u092e\\u093e\\u0928\\u094d\\u092f \\u0935\\u0930\\u094d\\u0924\\u092e\\u093e\\u0928', 'S + V1 (he/she/it: V1 + s/es)', 'S + do/does not + V1', 'Do/Does + S + V1 ?', 'Habits, daily routine, facts and truths', 'always, usually, often, never, every day', 'She plays cricket every day.', 'The sun rises in the east.', 'Habit or truth. Think: every day.'],\n    ['Present', 1, '\\u0924\\u093e\\u0924\\u094d\\u0915\\u093e\\u0932\\u093f\\u0915 \\u0935\\u0930\\u094d\\u0924\\u092e\\u093e\\u0928', 'S + am/is/are + V1-ing', 'S + am/is/are not + V1-ing', 'Am/Is/Are + S + V1-ing ?', 'Happening right now, at this moment', 'now, at the moment, look!, listen!', 'She is playing cricket now.', 'The children are reading.', 'ING + now. Look, it is happening!'],\n    ['Present', 2, '\\u092a\\u0942\\u0930\\u094d\\u0923 \\u0935\\u0930\\u094d\\u0924\\u092e\\u093e\\u0928', 'S + has/have + V3', 'S + has/have not + V3', 'Has/Have + S + V3 ?', 'Work finished just now, and the result is still here', 'just, already, yet, ever, never, so far', 'She has finished her homework.', 'I have already eaten.', 'Has/have + V3. Just done!'],\n    ['Present', 3, '\\u092a\\u0942\\u0930\\u094d\\u0923 \\u0924\\u093e\\u0924\\u094d\\u0915\\u093e\\u0932\\u093f\\u0915 \\u0935\\u0930\\u094d\\u0924\\u092e\\u093e\\u0928', 'S + has/have been + V1-ing', 'S + has/have not been + V1-ing', 'Has/Have + S + been + V1-ing ?', 'Started in the past and is still going on', 'since, for, how long, all day', 'She has been playing since morning.', 'It has been raining for two hours.', 'Been + ING with since / for.'],\n    ['Past', 0, '\\u0938\\u093e\\u092e\\u093e\\u0928\\u094d\\u092f \\u092d\\u0942\\u0924\\u0915\\u093e\\u0932', 'S + V2', 'S + did not + V1', 'Did + S + V1 ?', 'Finished action in the past', 'yesterday, ago, last week, in 2010', 'She played cricket yesterday.', 'We watched a movie last night.', 'V2 + yesterday. Over and finished.'],\n    ['Past', 1, '\\u0905\\u092a\\u0942\\u0930\\u094d\\u0923 \\u092d\\u0942\\u0924\\u0915\\u093e\\u0932', 'S + was/were + V1-ing', 'S + was/were not + V1-ing', 'Was/Were + S + V1-ing ?', 'Was going on at a time in the past', 'while, when, at 5 pm yesterday', 'She was playing at five yesterday.', 'I was reading when he came.', 'Was/were + ING. In the middle of it.'],\n    ['Past', 2, '\\u092a\\u0942\\u0930\\u094d\\u0923 \\u092d\\u0942\\u0924\\u0915\\u093e\\u0932', 'S + had + V3', 'S + had not + V3', 'Had + S + V3 ?', 'The earlier of two past actions', 'before, after, by the time, already', 'The train had left before I reached.', 'She had eaten when I called.', 'Had + V3. Done before another past.'],\n    ['Past', 3, '\\u092a\\u0942\\u0930\\u094d\\u0923 \\u0924\\u093e\\u0924\\u094d\\u0915\\u093e\\u0932\\u093f\\u0915 \\u092d\\u0942\\u0924\\u0915\\u093e\\u0932', 'S + had been + V1-ing', 'S + had not been + V1-ing', 'Had + S + been + V1-ing ?', 'Was going on for some time before a past moment', 'for, since, before', 'She had been playing for two hours when it rained.', 'He had been waiting since noon.', 'Had been + ING. Long work before.'],\n    ['Future', 0, '\\u0938\\u093e\\u092e\\u093e\\u0928\\u094d\\u092f \\u092d\\u0935\\u093f\\u0937\\u094d\\u092f', 'S + will + V1', 'S + will not + V1', 'Will + S + V1 ?', 'Will happen later, plans and promises', 'tomorrow, next week, soon, tonight', 'She will play cricket tomorrow.', 'I will call you tonight.', 'Will + V1. Tomorrow.'],\n    ['Future', 1, '\\u0905\\u092a\\u0942\\u0930\\u094d\\u0923 \\u092d\\u0935\\u093f\\u0937\\u094d\\u092f', 'S + will be + V1-ing', 'S + will not be + V1-ing', 'Will + S + be + V1-ing ?', 'Will be going on at a time in the future', 'this time tomorrow, at 5 pm tomorrow', 'She will be playing at five tomorrow.', 'I will be sleeping at midnight.', 'Will be + ING. At that time.'],\n    ['Future', 2, '\\u092a\\u0942\\u0930\\u094d\\u0923 \\u092d\\u0935\\u093f\\u0937\\u094d\\u092f', 'S + will have + V3', 'S + will not have + V3', 'Will + S + have + V3 ?', 'Will be finished before a future time', 'by tomorrow, by 6 pm, by the time', 'She will have finished by six.', 'They will have left by then.', 'Will have + V3. Done by then.'],\n    ['Future', 3, '\\u092a\\u0942\\u0930\\u094d\\u0923 \\u0924\\u093e\\u0924\\u094d\\u0915\\u093e\\u0932\\u093f\\u0915 \\u092d\\u0935\\u093f\\u0937\\u094d\\u092f', 'S + will have been + V1-ing', 'S + will not have been + V1-ing', 'Will + S + have been + V1-ing ?', 'Will have been going on for some time by a future point', 'by next year, for ten years', 'By June she will have been playing for five years.', 'I will have been working here for a year.', 'Will have been + ING. Long till then.']\n  ].map(function (a, i) { return { i: i, time: a[0], type: a[1], hi: a[2], pos: a[3], neg: a[4], q: a[5], use: a[6], sig: a[7], e1: a[8], e2: a[9], trick: a[10], name: a[0] + ' ' + TYPES[a[1]].k }; });\n  function byTT(time, type) { return D.filter(function (d) { return d.time === time && d.type === type; })[0]; }\n\n  /* ---------- sound ---------- */\n  var voices = [];\n  function lang(v) { return String(v.lang || '').replace('_', '-'); }\n  function score(v) { var l = lang(v), n = v.name || '', s; if (l === 'en-IN') s = 100; else if (l.indexOf('en') === 0) s = 10; else return -1; if (/natural|neural|online/i.test(n)) s += 40; if (/neerja|prabhat|heera|ravi/i.test(n)) s += 30; if (/google/i.test(n)) s += 15; return s; }\n  function pick() { return voices.filter(function (v) { return score(v) >= 0; }).sort(function (a, b) { return score(b) - score(a); })[0] || null; }\n  function loadVoices() { try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; } }\n  if ('speechSynthesis' in window) { try { window.speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) {} loadVoices(); }\n  function say(text) {\n    if (!('speechSynthesis' in window)) { toast('This browser cannot speak.'); return; }\n    try { window.speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text), v = pick(); if (v) { u.voice = v; u.lang = lang(v); } else u.lang = 'en-IN'; u.rate = S.slow ? 0.55 : 0.85; window.speechSynthesis.speak(u); } catch (e) {}\n  }\n  function sayTense(d) { say(d.name + '. ' + d.pos.replace(/\\bS\\b/g, 'subject').replace(/V1-ing/g, 'verb ing').replace(/V1/g, 'verb one').replace(/V3/g, 'verb three').replace(/V2/g, 'verb two').replace(/\\+/g, 'plus') + '. For example: ' + d.e1); }\n  function setSlow() { var b = $('#slow'); b.setAttribute('aria-pressed', S.slow ? 'true' : 'false'); b.dataset.tip = S.slow ? 'Slow voice: on' : 'Slow voice: off'; }\n  $('#slow').addEventListener('click', function () { S.slow = !S.slow; save(); setSlow(); toast(S.slow ? 'Slow voice on' : 'Slow voice off'); });\n\n  /* ---------- chart ---------- */\n  var view = 'chart';\n  function chart() {\n    var h = '\u003carticle class=\"sheet\" aria-label=\"Tenses chart\">\u003cheader class=\"head\">\u003cdiv class=\"head-text\">\u003ch1 class=\"title\" style=\"margin:0\">12 Tenses Chart\u003c/h1>\u003cdiv class=\"sub\" style=\"margin:0\">Time + type = tense. Learn all 12 the easy way\u003c/div>\u003c/div>\u003cdiv class=\"head-meta\">Tap to open\u003c/div>\u003c/header>';\n    h += '\u003cdiv class=\"tn-chart\">\u003cdiv>\u003c/div>' + TIMES.map(function (t) { return '\u003cdiv class=\"tn-h\">' + t + '\u003c/div>'; }).join('');\n    TYPES.forEach(function (ty, r) {\n      h += '\u003cdiv class=\"tn-r\" style=\"background:' + ty.col + '\">' + ty.k + '\u003csmall>' + ty.rule + '\u003c/small>\u003c/div>';\n      TIMES.forEach(function (t) { var d = byTT(t, r); h += '\u003cbutton type=\"button\" class=\"tn-c\" style=\"--k:' + ty.col + '\" data-i=\"' + d.i + '\">\u003cb>' + d.name + '\u003c/b>\u003cspan class=\"f\">' + esc(d.pos) + '\u003c/span>\u003cspan class=\"e\">' + esc(d.e1) + '\u003c/span>\u003c/button>'; });\n    });\n    h += '\u003c/div>';\n    h += '\u003cdiv class=\"tn-box\">\u003ch3>Easy way to remember: 2 steps\u003c/h3>\u003cdiv class=\"tn-steps\">' +\n      '\u003cdiv class=\"tn-st\" style=\"--k:var(--ink)\">\u003cb>Step 1: pick the time.\u003c/b>\u003cbr>Past, Present or Future. Future always uses \u003cb>will\u003c/b>.\u003c/div>' +\n      TYPES.slice(0, 3).map(function (ty) { return '\u003cdiv class=\"tn-st\" style=\"--k:' + ty.col + '\">\u003cb>Step 2: ' + ty.k + '.\u003c/b>\u003cbr>' + ty.mem + '\u003c/div>'; }).join('') + '\u003c/div>' +\n      '\u003cdiv class=\"tn-steps\" style=\"margin-top:8px\">\u003cdiv class=\"tn-st\" style=\"--k:' + TYPES[3].col + ';grid-column:span 4\">\u003cb>Perfect Continuous\u003c/b> = Perfect + Continuous = \u003cb>been + ING\u003c/b>. Going on for some time (for / since).\u003c/div>\u003c/div>\u003c/div>';\n    h += '\u003cdiv class=\"tn-box\">\u003ch3>Helper words (the verb is V1, V1-ing or V3 as shown)\u003c/h3>\u003ctable class=\"tn-help\">\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Past\u003c/th>\u003cth>Present\u003c/th>\u003cth>Future\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>' +\n      [['Simple', 'V2 &middot; did + V1', 'V1 (s/es) &middot; do/does + V1', 'will + V1'], ['Continuous', 'was/were + ING', 'am/is/are + ING', 'will be + ING'], ['Perfect', 'had + V3', 'has/have + V3', 'will have + V3'], ['Perfect Continuous', 'had been + ING', 'has/have been + ING', 'will have been + ING']].map(function (r) { return '\u003ctr>\u003ctd>' + r[0] + '\u003c/td>\u003ctd>' + r[1] + '\u003c/td>\u003ctd>' + r[2] + '\u003c/td>\u003ctd>' + r[3] + '\u003c/td>\u003c/tr>'; }).join('') + '\u003c/tbody>\u003c/table>\u003c/div>';\n    h += '\u003cfooter class=\"foot\">\u003cspan>Time + Type = Tense &middot; Say it &middot; Write it &middot; Test yourself\u003c/span>\u003cspan>Tenses\u003c/span>\u003c/footer>\u003c/article>';\n    return h;\n  }\n  /* ---------- detail ---------- */\n  var cur = 0;\n  function openDet(i) {\n    cur = (i + D.length) % D.length; var d = D[cur], ty = TYPES[d.type];\n    $('#dName').textContent = d.name + ' Tense'; $('#dName').style.color = ty.col; $('#dHi').textContent = d.hi;\n    $('#dList').innerHTML = [['Positive', d.pos], ['Negative', d.neg], ['Question', d.q], ['Use', d.use], ['Words that help', d.sig], ['Example 1', d.e1], ['Example 2', d.e2]].map(function (r) { return '\u003cdt>' + r[0] + '\u003c/dt>\u003cdd>' + esc(r[1]) + '\u003c/dd>'; }).join('');\n    $('#dTrick').textContent = 'Easy way: ' + d.trick + ' ' + ty.mem;\n    $('#det').hidden = false; sayTense(d);\n  }\n  function closeDet() { $('#det').hidden = true; try { window.speechSynthesis.cancel(); } catch (e) {} }\n  $('#dClose').addEventListener('click', closeDet); $('#dNext').addEventListener('click', function () { openDet(cur + 1); }); $('#dPrev').addEventListener('click', function () { openDet(cur - 1); }); $('#dSay').addEventListener('click', function () { sayTense(D[cur]); });\n  $('#det').addEventListener('mousedown', function (e) { if (e.target === $('#det')) closeDet(); });\n\n  /* ---------- quiz ---------- */\n\n  /* ---------- sentence maker: thousands of practice sentences ---------- */\n  var SUBJ = [['I', 'f'], ['You', 'p'], ['We', 'p'], ['They', 'p'], ['He', 's'], ['She', 's'], ['Ravi', 's'], ['Sita', 's'], ['My brother', 's'], ['The teacher', 's'], ['The children', 'p'], ['My friends', 'p']];\n  var VERBS = [\n    ['play', 'played', 'played', 'playing', 'plays', 'cricket'], ['eat', 'ate', 'eaten', 'eating', 'eats', 'lunch'], ['write', 'wrote', 'written', 'writing', 'writes', 'a letter'], ['read', 'read', 'read', 'reading', 'reads', 'a book'],\n    ['drink', 'drank', 'drunk', 'drinking', 'drinks', 'water'], ['drive', 'drove', 'driven', 'driving', 'drives', 'a car'], ['sing', 'sang', 'sung', 'singing', 'sings', 'a song'], ['draw', 'drew', 'drawn', 'drawing', 'draws', 'a picture'],\n    ['clean', 'cleaned', 'cleaned', 'cleaning', 'cleans', 'the room'], ['cook', 'cooked', 'cooked', 'cooking', 'cooks', 'dinner'], ['wash', 'washed', 'washed', 'washing', 'washes', 'the clothes'], ['watch', 'watched', 'watched', 'watching', 'watches', 'television'],\n    ['help', 'helped', 'helped', 'helping', 'helps', 'the neighbours'], ['paint', 'painted', 'painted', 'painting', 'paints', 'the wall'], ['buy', 'bought', 'bought', 'buying', 'buys', 'vegetables'], ['make', 'made', 'made', 'making', 'makes', 'tea'],\n    ['take', 'took', 'taken', 'taking', 'takes', 'photos'], ['bring', 'brought', 'brought', 'bringing', 'brings', 'a gift'], ['open', 'opened', 'opened', 'opening', 'opens', 'the door'], ['close', 'closed', 'closed', 'closing', 'closes', 'the window'],\n    ['learn', 'learned', 'learned', 'learning', 'learns', 'new words'], ['teach', 'taught', 'taught', 'teaching', 'teaches', 'English'], ['study', 'studied', 'studied', 'studying', 'studies', 'science'], ['carry', 'carried', 'carried', 'carrying', 'carries', 'a heavy bag'],\n    ['climb', 'climbed', 'climbed', 'climbing', 'climbs', 'the hill'], ['catch', 'caught', 'caught', 'catching', 'catches', 'the ball'], ['throw', 'threw', 'thrown', 'throwing', 'throws', 'a stone'], ['sweep', 'swept', 'swept', 'sweeping', 'sweeps', 'the floor'],\n    ['build', 'built', 'built', 'building', 'builds', 'a house'], ['sell', 'sold', 'sold', 'selling', 'sells', 'fruits'], ['find', 'found', 'found', 'finding', 'finds', 'a pen'], ['speak', 'spoke', 'spoken', 'speaking', 'speaks', 'English'],\n    ['run', 'ran', 'run', 'running', 'runs', 'in the park'], ['walk', 'walked', 'walked', 'walking', 'walks', 'to school'], ['dance', 'danced', 'danced', 'dancing', 'dances', 'on the stage'], ['sleep', 'slept', 'slept', 'sleeping', 'sleeps', 'early'],\n    ['wait', 'waited', 'waited', 'waiting', 'waits', 'for the bus'], ['work', 'worked', 'worked', 'working', 'works', 'in the garden'], ['solve', 'solved', 'solved', 'solving', 'solves', 'the sum'], ['listen', 'listened', 'listened', 'listening', 'listens', 'to music'],\n    ['kick', 'kicked', 'kicked', 'kicking', 'kicks', 'the ball'], ['pack', 'packed', 'packed', 'packing', 'packs', 'the bags'], ['fix', 'fixed', 'fixed', 'fixing', 'fixes', 'the cycle']\n  ];\n  var PH = [\n    ['every day', 'every morning', 'every Sunday', 'on weekdays'], ['now', 'at the moment', 'right now'], ['just', 'already'], ['since morning', 'since five o’clock', 'for two hours', 'for three days'],\n    ['yesterday', 'last night', 'last week', 'two days ago'], ['at five yesterday', 'at eight last night', 'at that time'], ['before the bell rang', 'before I came', 'before the guests arrived'], ['for two hours before it rained', 'for an hour before I came'],\n    ['tomorrow', 'next week', 'tonight', 'soon'], ['at five tomorrow', 'this time tomorrow', 'at eight tonight'], ['by tomorrow', 'by six in the evening', 'by next Monday'], ['for two hours by evening', 'for five years by next June']\n  ];\n  var TOTAL = PH.reduce(function (a, p) { return a + p.length; }, 0) * SUBJ.length * VERBS.length;\n  function rnd(a) { return a[Math.floor(Math.random() * a.length)]; }\n  function make(idx) {\n    var sb = rnd(SUBJ), v = rnd(VERBS), ph = rnd(PH[idx]), n = sb[0], k = sb[1], sing = k === 's';\n    var bp = k === 'f' ? 'am' : sing ? 'is' : 'are', bpast = (k === 'f' || sing) ? 'was' : 'were', hv = sing ? 'has' : 'have', o = ' ' + v[5], r;\n    switch (idx) {\n      case 0: r = n + ' ' + (sing ? v[4] : v[0]) + o + ' ' + ph; break;\n      case 1: r = n + ' ' + bp + ' ' + v[3] + o + ' ' + ph; break;\n      case 2: r = n + ' ' + hv + ' ' + ph + ' ' + v[2] + o; break;\n      case 3: r = n + ' ' + hv + ' been ' + v[3] + o + ' ' + ph; break;\n      case 4: r = n + ' ' + v[1] + o + ' ' + ph; break;\n      case 5: r = n + ' ' + bpast + ' ' + v[3] + o + ' ' + ph; break;\n      case 6: r = n + ' had ' + v[2] + o + ' ' + ph; break;\n      case 7: r = n + ' had been ' + v[3] + o + ' ' + ph; break;\n      case 8: r = n + ' will ' + v[0] + o + ' ' + ph; break;\n      case 9: r = n + ' will be ' + v[3] + o + ' ' + ph; break;\n      case 10: r = n + ' will have ' + v[2] + o + ' ' + ph; break;\n      default: r = n + ' will have been ' + v[3] + o + ' ' + ph;\n    }\n    return [r + '.', idx];\n  }\n  var Q = [], qi = 0, score_ = 0, pickT = -1, pickY = -1, answered = false;\n  var SENT = [['She plays cricket every day.', 0], ['The sun rises in the east.', 0], ['She is playing cricket now.', 1], ['Look! The baby is crying.', 1], ['I have just finished my work.', 2], ['She has already eaten.', 2], ['He has been working since morning.', 3], ['It has been raining for two hours.', 3], ['We watched a movie yesterday.', 4], ['He went to school last week.', 4], ['I was reading when you called.', 5], ['They were playing at five yesterday.', 5], ['The train had left before I reached.', 6], ['She had eaten before I came.', 6], ['She had been waiting for an hour when I arrived.', 7], ['He had been playing since noon.', 7], ['I will call you tomorrow.', 8], ['She will help you.', 8], ['I will be sleeping at midnight.', 9], ['This time tomorrow we will be flying.', 9], ['She will have finished by six.', 10], ['They will have left by then.', 10], ['By June she will have been working here for a year.', 11], ['I will have been studying for five hours by noon.', 11]];\n  function newQuiz() { Q = []; for (var i = 0; i \u003c 10; i++) { var t = Math.floor(Math.random() * 12); var m = make(t); if (Math.random() \u003c 0.2) m = rnd(SENT); Q.push(m); } qi = 0; score_ = 0; quiz(); }\n  function quiz() {\n    pickT = -1; pickY = -1; answered = false; var el = $('#sheets');\n    if (qi >= Q.length) { el.innerHTML = '\u003cdiv class=\"tn-q\">\u003cdiv class=\"s\">You scored ' + score_ + ' out of ' + Q.length + '\u003c/div>\u003cbutton type=\"button\" class=\"btn primary\" id=\"qAgain\">Play again\u003c/button>\u003c/div>'; $('#qAgain').addEventListener('click', newQuiz); return; }\n    var q = Q[qi];\n    el.innerHTML = '\u003cdiv class=\"tn-q\">\u003cdiv class=\"tn-bar\">\u003cspan>Question ' + (qi + 1) + ' of ' + Q.length + '\u003c/span>\u003cspan>Score ' + score_ + '\u003c/span>\u003c/div>\u003cdiv class=\"help\" style=\"text-align:center\">' + TOTAL.toLocaleString() + ' practice sentences, a new set every time\u003c/div>\u003cdiv class=\"s\">' + esc(q[0]) + '\u003c/div>' +\n      '\u003cdiv class=\"lab\">1. What is the time?\u003c/div>\u003cdiv class=\"tn-opts\" id=\"oT\">' + TIMES.map(function (t, k) { return '\u003cbutton type=\"button\" class=\"btn\" data-k=\"' + k + '\" aria-pressed=\"false\">' + t + '\u003c/button>'; }).join('') + '\u003c/div>' +\n      '\u003cdiv class=\"lab\">2. What is the type?\u003c/div>\u003cdiv class=\"tn-opts\" id=\"oY\">' + TYPES.map(function (t, k) { return '\u003cbutton type=\"button\" class=\"btn\" data-k=\"' + k + '\" aria-pressed=\"false\">' + t.k + '\u003c/button>'; }).join('') + '\u003c/div>' +\n      '\u003cdiv class=\"tn-fb\" id=\"fb\">\u003c/div>\u003cdiv class=\"tn-opts\">\u003cbutton type=\"button\" class=\"btn primary\" id=\"qCheck\">Check\u003c/button>\u003cbutton type=\"button\" class=\"btn\" id=\"qHear\">Hear sentence\u003c/button>\u003c/div>\u003c/div>';\n    $('#qHear').addEventListener('click', function () { say(q[0]); });\n    function wire(id, setter) { $(id).addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b || answered) return; setter(+b.dataset.k); this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); }); }\n    wire('#oT', function (k) { pickT = k; }); wire('#oY', function (k) { pickY = k; });\n    $('#qCheck').addEventListener('click', function () {\n      if (answered) { qi++; quiz(); return; }\n      if (pickT \u003c 0 || pickY \u003c 0) { toast('Choose the time and the type first.'); return; }\n      answered = true; var d = D[q[1]], ok = TIMES[pickT] === d.time && pickY === d.type; if (ok) score_++;\n      var fb = $('#fb'); fb.className = 'tn-fb ' + (ok ? 'ok' : 'no');\n      fb.innerHTML = (ok ? 'Correct! ' : 'Not quite. ') + esc(d.name) + ' tense.\u003cbr>\u003csmall style=\"font-weight:500;color:var(--muted)\">' + esc(d.pos) + ' &middot; ' + esc(d.trick) + '\u003c/small>';\n      this.textContent = qi + 1 >= Q.length ? 'See score' : 'Next question';\n    });\n  }\n  /* ---------- views ---------- */\n  function setView(v) {\n    view = v; $('#vChart').setAttribute('aria-pressed', v === 'chart' ? 'true' : 'false'); $('#vQuiz').setAttribute('aria-pressed', v === 'quiz' ? 'true' : 'false');\n    if (v === 'chart') $('#sheets').innerHTML = chart(); else newQuiz();\n  }\n  $('#vChart').addEventListener('click', function () { setView('chart'); }); $('#vQuiz').addEventListener('click', function () { setView('quiz'); });\n  $('#sheets').addEventListener('click', function (e) { var c = e.target.closest('.tn-c'); if (c) openDet(+c.dataset.i); });\n  document.addEventListener('keydown', function (e) {\n    if (!$('#det').hidden) { if (e.key === 'Escape') closeDet(); else if (e.key === 'ArrowRight') openDet(cur + 1); else if (e.key === 'ArrowLeft') openDet(cur - 1); }\n  });\n  setSlow(); setView('chart');\n})();\n\u003c/script>\n"};
  window.__go=function(w){
    try{window.speechSynthesis.cancel();}catch(e){}
    document.open(); document.write(PG[w]||PG.hard); document.close();
    window.scrollTo(0,0);
  };
  window.__go('hard');
})();
</script>
